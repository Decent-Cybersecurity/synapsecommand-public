# CI — the workflow that can FAIL on a branch, which is the thing this repository did not have.
#
# WHY IT EXISTS, stated here rather than in a commit message
# ----------------------------------------------------------
# `publish.yml` is triggered by a `v*` tag and by `workflow_dispatch`. Nothing else starts it, so
# until this file landed a change to a branch started no workflow at all, and every "CI MUST fail
# if …" clause of the SOIF Part 1 specification — a missing or invalid manifest, an impossible
# direction, an unknown maturity value, a conformance regression, a fixture without provenance —
# had nothing to fail on. `ARCHITECTURE.md` §7 designs this file and gives the job table it grows
# into; P1 landed the first rows, P2, P4, P5, P6 and PB added theirs, and on 2026-09-16 two checks
# that until then ran only at a tag — the lint stage and `gates/wheel_install.py` — became the
# `lint` and `wheel` jobs, so that a red in either arrives on the push and not on the release.
# §7's table is the job set as it stands.
#
# WHY IT IS A SEPARATE FILE AND NOT MORE JOBS IN `publish.yml`
# ------------------------------------------------------------
# `ARCHITECTURE.md` §7, in as many words: "a release pipeline that also runs pull-request checks
# becomes a release pipeline nobody may restructure". `publish.yml` keeps its present shape and
# its present triggers.
#
# THE STEPS ARE `publish.yml`'s GATE HALF, DELIBERATELY IDENTICAL IN SUBSTANCE
# ----------------------------------------------------------------------------
# Same install — `pip install -e "packages/cdm[test]"`, which is CONTRIBUTING.md's documented
# setup command — and the same `pytest -q`. Two files running the suite two different ways is two
# different greens, and the one that gates a release would be the one nobody had read. The one
# deliberate difference, since 2026-09-16: the `suite` job here runs on EVERY interpreter
# `pyproject.toml` declares (the matrix below), where `publish.yml` runs it once, on 3.12, the
# release interpreter; the other jobs of this file use 3.12 for the same reason `publish.yml` does.
#
# ACTIONS PINNED BY SHA, from the first commit. `tests/test_cdm_security_policy.py` requires it of
# every workflow; starting compliant was cheaper than a migration, and a tag is a moving target on
# somebody else's account.
name: CI

on:
  push:
    branches:
      - main
      - 'soif/**'
  pull_request:

# Read-only, and nothing here widens it. This workflow publishes nothing, signs nothing and
# needs no token. `id-token: write` is granted on `publish.yml`'s `publish` job (the PyPI token)
# and `attest` job (the Sigstore token) and on `rc-build.yml`'s `attest` job, and nowhere else —
# `tests/test_cdm_security_policy.py` and `tests/test_cdm_trusted_publishing.py`'s
# PERMITTED_WRITES hold that. (Corrected 2026-09-16: this sentence said "`publish.yml`'s publish
# job alone", which stopped being true when round P7 added the attestation stage.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite, gates and manifests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # Every interpreter `packages/cdm/pyproject.toml` declares (classifiers 3.11–3.14), so the
      # floor and the ceiling are EXECUTED here rather than parsed at grammar level only — until
      # 2026-09-16 the only floor evidence was `tests/test_cdm_version_floor.py`'s parse of the
      # tree at 3.11 grammar, and nothing ran the suite on 3.11, 3.13 or 3.14 anywhere but a
      # maintainer's machine. The three self-tests in that module that assert on the wording of
      # findings a >=3.12 parser produces are guarded with `skipif` for the 3.11 leg, whose extra
      # value is the corroboration test that only RUNS when a real 3.11 is on PATH.
      # `fail-fast: false`: a red on one interpreter must not cancel the reading on the others.
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags, for the same reason `publish.yml` takes them:
          # `tests/test_cdm_release.py` re-derives every tag in history against its tree's
          # PACKAGE_VERSION, and `gates/bump_derivation.py` reads the arc since the last tag. A
          # shallow clone makes both of those pass vacuously rather than fail.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install by the documented path
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"

      - name: The suite
        # `-rs` for the reason `publish.yml` gives: a CI green is not the same green a maintainer
        # sees — the pinned specification PDFs are gitignored, so a fresh clone has the pin
        # RECORDS and not the documents and skips accordingly — and the difference has to be
        # legible rather than hidden inside one number. The counts are deliberately NOT asserted.
        run: python -m pytest -q -rs

      - name: The published schemas are what the models generate
        run: python -m synapse_cdm.schemas --check --out schemas

      - name: The published manifests are what the adapters declare
        # §16: CI MUST fail if a manifest is missing or its schema is invalid. `--check` reports
        # missing, stale AND orphaned; the suite step above is what fails on an impossible
        # direction, an unknown maturity value or a missing limitation, because those are refused
        # at class definition and by the models rather than by a file comparison.
        run: python -m synapse_cdm.manifests --check --out manifests

      - name: The pin gate
        run: python gates/pin_paths.py

      - name: The parks gate
        run: python gates/parks_table.py

      - name: The commit-message gate
        run: python gates/commit_message.py --rev HEAD

  lint:
    name: Lint — ruff, the release gate's rule set, on every push
    # A job of its own and NOT a step of the matrixed `suite` job, which would run it four times
    # for one reading. Until 2026-09-16 ruff ran only in `publish.yml`'s gate — on a tag push or a
    # dispatch — so a finding surfaced at release time and nowhere earlier, which is the exposure
    # `packages/cdm/pyproject.toml`'s own lint comment names: a stage added red is a stage somebody
    # switches off. Here it goes red on the push that introduced the finding.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned linter from the package's own extra
        # `[lint]` is the ONE place the ruff version is pinned. `publish.yml` installs the same
        # extra, and `tests/test_cdm_lint_stage.py` refuses a `ruff==` typed into either workflow,
        # so the tool version and the rule set are read from one file by both.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[lint]"

      - name: ruff, the same command publish.yml's gate runs
        # `--config` explicitly for the reason publish.yml gives: there is no pyproject.toml at
        # the repository root, so `gates/` and `tests/` would otherwise be linted under ruff's
        # DEFAULT rule set.
        run: ruff check --config packages/cdm/pyproject.toml packages/cdm gates tests

  wheel:
    name: The installed package is the tested package (gates/wheel_install.py)
    # Until 2026-09-16 this gate ran end to end only in `rc-build.yml` and in `publish.yml`'s
    # build job — a dispatch or a tag — and its own history says what that costs: its rosters
    # drifted and it stayed red on `main` for a period because "the thing that noticed was the
    # thing nobody runs" (`tests/test_cdm_gate_rosters.py`). The offline half already runs on
    # every `pytest`; this is the other half, on every push. It is a job of its own because the
    # `supply-chain` job installs `build` for its own `python -m build`, and the gate refuses to
    # share an interpreter with a second copy of `build` — a second copy alongside would leave
    # which one built the artefact depending on PATH (`rc-build.yml` and `publish.yml` state the
    # same reason).
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The release interpreter (`publish.yml`'s build job): this gate builds the twin of the
          # release artefact, and building it on the same interpreter is what makes the reading
          # comparable.
          python-version: '3.12'

      - name: Install by the documented path
        # `build` is deliberately NOT installed here — the gate provisions it into a venv of its
        # own. The `[test]` extra is needed because the gate's `slice` check runs a test slice
        # with THIS interpreter and `PYTHONPATH=packages/cdm`.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"

      - name: The gate, including the mutation check
        # Same invocation as publish.yml's condition 2 minus `--export-dist`: nothing here uploads,
        # so nothing here needs the bytes. 13 checks plus the proof that they can refuse a wheel.
        run: python gates/wheel_install.py --mutation-check

  conformance:
    name: Conformance Suite v2, every shipped adapter
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install by the documented path
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"

      - name: Every adapter, under the checks every adapter can be held to
        # §22: "regressions MUST fail CI". The sweep is a SHELL LOOP over the roster the package
        # itself reports, not a list of fourteen names — a list would go stale the way every
        # enumerated roster in this repository has gone stale, and a fifteenth adapter would be
        # swept by nobody.
        #
        # WHY THE REQUIRED SET IS THESE TEN AND NOT ALL FIFTEEN, each absence a reading:
        #   E  roundtrip  — a DECLARED SKIP for the three ingest-only adapters, which have no
        #                   egress direction to lose information in, and a required SKIP exits
        #                   non-zero (§19). PASS for the eleven that emit, computed since
        #                   2026-09-16 under each class's `ROUNDTRIP_TOLERANCE`; before that it
        #                   was SKIP for all fourteen, because the harness could not read
        #                   non-JSON egress bytes. `test_cdm_suite.py` requires the PASS.
        #   I  unknown    — SKIP where the adapter declares `unknown_fields: none`, which seven do.
        #   M  streaming  — SKIP for all fourteen; no adapter can declare the capability today.
        #   N  robustness — SKIP for the two adapters that ship no byte fixture to truncate.
        # None of the four is FAIL anywhere, and `test_cdm_suite.py` re-derives that rather than
        # trusting this comment: a check quietly dropped because it FAILED would be a green bar
        # over a hole.
        #
        # **O LEFT THAT LIST IN ROUND P5 AND THE LIST WAS FIVE.** P2 excluded it because no
        # adapter declared `max_input_bytes` at all. P5 declares one on all fourteen — five
        # NORMATIVE, nine an IMPLEMENTATION CAP, each with its basis in the manifest — and puts
        # the enforcement in `Adapter.__init_subclass__`, so O is PASS everywhere and is required
        # here. It is the check that would notice a bound being quietly removed from a manifest.
        run: |
          set -euo pipefail
          for adapter in $(python -c "from synapse_cdm.adapter import roster; print(' '.join(roster()))"); do
            echo "::group::$adapter"
            python -m synapse_cdm.suite conformance run --adapter "$adapter" \
              --require A,B,C,D,F,G,H,J,K,L,O
            echo "::endgroup::"
          done

      - name: The report is machine-readable and says CONFORMANT
        run: |
          set -euo pipefail
          python -m synapse_cdm.suite conformance run --adapter cat021 --format json \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['result']=='CONFORMANT', r['result']; print(r['maturity_eligible'])"

  evidence:
    name: Evidence records, provenance and badges
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # §32's record carries `source_commit`, and `synapse evidence generate` reads it with
          # `git rev-parse HEAD`. A checkout is enough for that; full history is not needed here
          # the way it is for the suite job's tag arithmetic.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install by the documented path
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"

      - name: Every fixture family declares its provenance
        # §33: "CI MUST fail when a covered fixture family lacks the required provenance record"
        # (M's ruling, 2026-09-08). Unconditional from round P4 — there is no migration flag and
        # no skip: a check that passed while a record was missing would be the whole defect.
        run: python -m synapse_cdm.evidence provenance

      - name: Generate an evidence record for every adapter
        # `evidence/` is gitignored (F4.1): the record names the commit it measured and hashes
        # every fixture the run read, so it is PRODUCED here rather than tracked. The release
        # round attaches this artefact to the GitHub Release, which is the point at which
        # `evidence.available` may become true for a consumer who cannot run the package.
        run: python -m synapse_cdm.evidence generate --all --out evidence

      - name: Verify every record against the tree it was generated from
        # §36's reproducibility: `verify` re-hashes the fixtures and re-runs the suite, and
        # compares every field but `MASKED` (the instant and the wall time) and `ENVIRONMENT`
        # (`test_run.python`, `test_run.platform` — recorded and printed, never compared, since
        # 2026-09-16). This step runs in the same job and therefore on the same tree and host;
        # the cross-host half of §36 — a record made on one machine, verified from another
        # checkout — is exercised by `tests/test_cdm_evidence.py::
        # test_a_record_from_another_host_and_checkout_reproduces`, which the `suite` job runs. A
        # record that cannot be reproduced by the machine that made it is a record of nothing,
        # and this is the step that would say so.
        run: |
          set -euo pipefail
          find evidence -name evidence.json -print0 \
            | xargs -0 python -m synapse_cdm.evidence verify

      - name: Badges, derived from the records and never hand-set
        run: python -m synapse_cdm.evidence badges --from evidence

      - name: Upload the evidence set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  secrets:
    name: gitleaks, over the full history reachable from this push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # §39: the scan is over HISTORY and not over the working tree. A secret committed and
          # then deleted is still in the pack, still fetchable, and still a secret — a scan of the
          # checkout would report green over exactly that. `fetch-depth: 0` is what makes the
          # `gitleaks git` invocation below have anything to walk.
          fetch-depth: 0

      # WHY THE BINARY AND NOT `gitleaks/gitleaks-action`
      # --------------------------------------------------
      # The action is the obvious choice and it is not usable here: it requires a paid licence
      # (`GITLEAKS_LICENSE`) for repositories owned by a GitHub ORGANIZATION, which this one is.
      # Adding it would put a secret-scanning job into CI that fails for want of a licence key —
      # a red job that says nothing about secrets.
      #
      # So the release ARTEFACT is pinned instead, and pinned harder than an action ref can be: a
      # version AND the SHA-256 of the exact tarball, from `gitleaks_8.30.1_checksums.txt` in the
      # upstream release. An action pinned by commit SHA pins source; this pins the bytes that
      # run. `sha256sum -c` is what makes the pin enforceable rather than decorative — the step
      # fails if the download is not that file.
      - name: Install gitleaks, pinned by version and by the artefact's SHA-256
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: No secret anywhere in the history this push carries
        # `--redact` for the reason §39 gives: a finding is a reason to rotate a credential, and a
        # CI log that printed the credential would be a second place it had leaked to. The exit
        # status is the gate — gitleaks exits non-zero when it finds anything, and nothing here
        # softens that with `|| true`.
        run: ./gitleaks git . --redact --config .gitleaks.toml --log-opts "--all"

  supply-chain:
    name: pip-audit, over the environment and over the wheel's frozen closure
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install by the documented path, and pip-audit beside it
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"
          python -m pip install pip-audit build

      - name: The exception allowlist, derived from the tree and printed before it is used
        # §45: the allowlist is DERIVED from `security/exceptions/` at run time and never typed
        # into this file. Printed as its own step so that a run's log carries the allowlist it
        # ran with — an audit that ignored a vulnerability without saying which is a green nobody
        # can check. An empty directory prints an empty line, which is the state today.
        id: ignores
        run: |
          set -euo pipefail
          ignores="$(python gates/codeql_gate.py --emit-pip-audit-ignores)"
          echo "derived: [${ignores}]"
          echo "flags=${ignores}" >> "${GITHUB_OUTPUT}"

      - name: pip-audit over the installed environment
        # `--strict` makes a dependency pip-audit cannot resolve a FAILURE rather than a skipped
        # line. Without it the audit passes on a package whose advisories were never fetched,
        # which is the shape of a green with a hole in it. The identifiers in `flags` are
        # constrained by `security/exceptions/schema.json`'s pattern to characters no shell
        # splits on, so the unquoted expansion is deliberate and safe.
        #
        # THE ONE DISTRIBUTION THIS AUDIT LEAVES OUT IS THE PROJECT ITSELF, by M's ruling of
        # 2026-09-09 and for the reason `publish.yml`'s `gate` job states at length: synapse-cdm
        # cannot be on PyPI at the version being released, so `--strict` over an environment that
        # contains it makes the audit demand the publication it gates. This job read
        # "synapse-cdm: Dependency not found on PyPI and could not be audited" at the release
        # commit, and `main` stayed red for exactly as long as the tree carried a version the index
        # had not been given yet.
        #
        # `--skip-editable` is the flag that looks like the answer and is not: pip-audit 2.10.1
        # treats a skipped distribution as a collection failure under `--strict` and exits 1 with
        # "distribution marked as editable". So the exclusion is a filter on the project's NAME,
        # over `pip list --format=freeze` — which writes `name==version` for every distribution
        # however it was installed, where `pip freeze` would write `-e git+file://…` for this one
        # and no name-anchored pattern could match it. The pattern is anchored to the start of the
        # line and to both PEP 503 spellings, and the count of removed lines is asserted to be
        # exactly one. No transitive dependency is excluded; every third-party distribution stays
        # under `--strict`. `tests/test_cdm_security_exceptions.py` fails on anything wider.
        run: |
          set -euo pipefail
          python -m pip list --format=freeze > environment.txt
          echo '--- the installed environment ---'
          cat environment.txt
          if ! grep -v -E '^synapse[-_]cdm==' environment.txt > environment-third-party.txt; then
            echo 'nothing is left to audit once the project under release is removed' >&2
            exit 1
          fi
          removed=$(( $(wc -l < environment.txt) - $(wc -l < environment-third-party.txt) ))
          echo "removed ${removed} line(s) naming the project under release"
          test "${removed}" -eq 1
          echo '--- the third-party set being audited ---'
          cat environment-third-party.txt
          # shellcheck disable=SC2086
          python -m pip_audit --strict -r environment-third-party.txt ${{ steps.ignores.outputs.flags }}

      - name: pip-audit over the wheel's own frozen closure, in a venv of its own
        # The step above audits the DEVELOPMENT environment — the package plus its `test` extra
        # plus pip-audit itself and everything those drag in. A consumer installs none of that.
        # This step builds the wheel, installs it alone into a clean virtual environment, lists
        # what that produced, and audits that list minus the project's own line: the third-party
        # closure a `pip install synapse-cdm` actually creates. The two readings differ and both
        # matter — the first is what CI runs on, the second is what a user gets.
        #
        # THE SAME EXCLUSION AS THE STEP ABOVE, THE SAME PATTERN, THE SAME COUNT ASSERTION, and it
        # is needed here for a second reason as well: a wheel installed from a local file is a
        # DIRECT REFERENCE, and `pip freeze` writes it as `synapse-cdm @ file:///…#sha256=…` —
        # a line no name-anchored filter matches and which `--strict` then fails on anyway,
        # because the version it names is not on the index. `pip list --format=freeze` writes
        # `synapse-cdm==<version>` instead, so one pattern serves both jobs. `frozen-closure.txt`
        # keeps the whole closure INCLUDING the project, because that is the record the artefact
        # upload below is for; only the audited copy has the line removed.
        run: |
          set -euo pipefail
          python -m build --wheel --outdir dist-audit packages/cdm
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip >/dev/null
          .audit-venv/bin/python -m pip install dist-audit/*.whl
          .audit-venv/bin/python -m pip list --format=freeze > frozen-closure.txt
          echo '--- the closure, whole ---'
          cat frozen-closure.txt
          if ! grep -v -E '^synapse[-_]cdm==' frozen-closure.txt > closure-third-party.txt; then
            echo 'nothing is left to audit once the project under release is removed' >&2
            exit 1
          fi
          removed=$(( $(wc -l < frozen-closure.txt) - $(wc -l < closure-third-party.txt) ))
          echo "removed ${removed} line(s) naming the project under release"
          test "${removed}" -eq 1
          echo '--- the third-party closure being audited ---'
          cat closure-third-party.txt
          # shellcheck disable=SC2086
          python -m pip_audit --strict -r closure-third-party.txt ${{ steps.ignores.outputs.flags }}

      - name: Upload the frozen closure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frozen-closure-${{ github.sha }}
          path: frozen-closure.txt
          if-no-files-found: error

  docs-audit:
    name: npm audit over docs/, at high, with the exceptions derived from security/exceptions/
    runs-on: ubuntu-latest
    # THE GAP THIS CLOSES, in one sentence: `pip-audit` is Python-only, `dependency-review.yml`
    # runs on pull requests only, and CodeQL analyses source rather than dependencies — so until
    # round PB nothing in CI looked at `docs/package-lock.json` on a push, and the repository was
    # green with seven high npm advisories standing (round P8's readiness report, blocker 2).
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node at the version the repository pins
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install from the committed lock
        # `npm ci` and not `npm install`: the audit has to be about the tree that ships, and
        # `npm install` may resolve something the lock does not contain, which would make a green
        # here a statement about today's registry rather than about this commit.
        run: npm ci --prefix docs

      - name: The exception allowlist, derived from the tree and printed before it is used
        # §45, and the same derivation the `supply-chain` job above uses: one directory, no
        # second list, nothing typed into this file. `--emit-pip-audit-ignores` prints
        # `--ignore-vuln <id>` pairs; the ids are what this job needs, and taking them from the
        # SAME command is what keeps the two jobs from drifting. An expired exception is dropped
        # by the gate itself, so the day one lapses this job goes red without anybody editing it.
        id: excepted
        run: |
          set -euo pipefail
          ids="$(python gates/codeql_gate.py --emit-pip-audit-ignores | sed 's/--ignore-vuln //g')"
          echo "derived: [${ids}]"
          echo "ids=${ids}" >> "${GITHUB_OUTPUT}"

      - name: npm audit --audit-level=high, for the log
        # M's ruling of 2026-09-08 names this command, so it is run verbatim and its output is in
        # the log. Its EXIT STATUS cannot be the job's: with an excepted advisory outstanding it
        # is always non-zero, and the step after this one is what decides. Captured with
        # `&& status=0 || status=$?`, which RECORDS the status rather than discarding it.
        # `tests/test_cdm_security_policy.py` forbids the two usual ways of discarding one
        # anywhere in this file — a rule written for the gitleaks step and correct here too: an
        # ignored exit status is invisible, and a printed one is not.
        run: |
          set -uo pipefail
          npm audit --prefix docs --audit-level=high && status=0 || status=$?
          echo "npm audit --audit-level=high exited ${status}; an excepted advisory makes that "
          echo "non-zero by construction, so the next step is the one that decides."

      - name: Fail on any high or critical advisory that is not excepted
        # The enforcing half. `npm audit --json` reports one entry per PACKAGE, and a package that
        # is merely a dependent of a vulnerable one inherits the severity while carrying no
        # advisory of its own — sixteen of the seventeen "high" entries on 2026-09-08 were that
        # shape. So the set that matters is the ADVISORIES, which are the object-valued `via`
        # entries, and an unexcepted one at high or critical is what fails the build.
        env:
          EXCEPTED: ${{ steps.excepted.outputs.ids }}
        run: |
          set -euo pipefail
          # `|| true` on the CAPTURE only: `npm audit` exits non-zero whenever it finds
          # anything, and what is being captured is the report, not a verdict. The verdict is
          # taken below, from the report's own contents.
          npm audit --prefix docs --json > npm-audit.json || true
          python - <<'PY'
          import json, os, sys

          excepted = set(os.environ.get("EXCEPTED", "").split())
          report = json.load(open("npm-audit.json"))
          advisories = {}
          for entry in report.get("vulnerabilities", {}).values():
              for via in entry.get("via", []):
                  if isinstance(via, dict):
                      advisories[via["url"].rsplit("/", 1)[-1]] = (via["severity"], via["title"])

          blocking = sorted(i for i, (sev, _) in advisories.items()
                            if sev in ("high", "critical") and i not in excepted)
          used = sorted(i for i in advisories if i in excepted)
          unused = sorted(excepted - set(advisories))

          print(f"advisories: {len(advisories)}; excepted and present: {used}; "
                f"excepted and absent: {unused}")
          for identifier in blocking:
              severity, title = advisories[identifier]
              print(f"BLOCKING {severity} {identifier} — {title}")
          if blocking:
              sys.exit(f"{len(blocking)} unexcepted high/critical npm advisory/advisories in "
                       "docs/. Upgrade the dependency, or write a time-bounded exception under "
                       "security/exceptions/ — never an ignore line in this workflow.")
          print("OK — no unexcepted high or critical npm advisory in docs/")
          PY

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-audit-${{ github.sha }}
          path: npm-audit.json
          if-no-files-found: error

      - name: The site still builds from the audited tree, and its own gates pass
        # Last step of the same job, deliberately: an upgrade that clears an advisory and breaks
        # the build is not a fix, and a separate job could go green on a lock the build rejects.
        #
        # `npm run ci` AND NOT `npm run build`, since 2026-09-16. `docs/README.md` has always
        # described `ci` as "what CI runs", and until this line CI ran only `build` — whose
        # `prebuild` hook REGENERATES the schema-reference pages rather than checking them, so a
        # hand-edited or stale committed page, a TypeScript error under `docs/src` or a broken
        # admonition passed here and was caught only by whoever ran the deploy block locally.
        # `ci` is `check:schemas && typecheck && build && check:admonitions`: the drift gate, the
        # type check, the build, and the check that every `:::` directive rendered. It runs
        # offline against the committed lock — the read that decided this was 2.3 s wall on a
        # warm checkout — and `--prefix` rather than `cd`, because
        # `tests/test_cdm_deploy_workflow.py` records what a persisting `cd` did to the deploy
        # sequence.
        run: npm --prefix docs run ci
