# Build `synapse-cdm`, gate it, and publish it to PyPI over OIDC.
#
# WHAT THIS REPLACES
# ------------------
# `PUBLICATION.md` ledger entry 5 records the 1.0.0 upload: a person ran `twine upload` with a
# long-lived API token. The token has no expiry, works from anywhere, and cannot be told apart on
# the index from any other use of itself. This workflow uploads with no token at all — GitHub mints
# a short-lived OIDC token scoped to this repository, this workflow file and this environment, and
# PyPI trades it for an upload good for that one run. There is no password, no token and no
# `secrets.*` reference anywhere in this file, and there is not meant to be one.
#
# BOTH HALVES HAVE NOW RUN
# ------------------------
# This paragraph used to say the `publish` job had NEVER RUN, and it was the most important
# sentence in the file: a green `workflow_dispatch` run proves the artefact is sound and says
# nothing whatever about whether an upload works.
#
#   * the `build` job was proven first, by `workflow_dispatch` against `main` — three runs, the
#     first two of which FAILED on defects in this file that no amount of reading it would have
#     found (a missing editable install, and a schema check run in the wrong directory);
#   * the `publish` job first ran on **2026-08-26**, publishing `synapse-cdm` 1.1.0 in
#     [run 32944124955](https://github.com/Decent-Cybersecurity/synapsecommand-public/actions/runs/32944124955).
#     It had never run before that, so 1.1.0 was its first live test, and it worked: the upload was
#     accepted over OIDC with no credential anywhere in this file, and PyPI's SHA-256 digests equal
#     the ones `--export-dist` handed the publish job.
#
# What that run did NOT prove, and what still has no test: the failure modes. A refused upload — a
# trusted publisher that was never registered, or an environment name that does not match PyPI's
# form — has not been observed, because the configuration was correct the first time. So the
# recovery path is still unexercised, and the thing to do if a future upload is refused is to fix
# the four values on pypi.org per ledger entry 6, NOT to paste a token in here.
#
# Ledger entry 6 carries the four values that have to agree, the run id, the digests, and the one
# step of it still open.
#
# THE ENVIRONMENT, AND THE REVIEWERS ON IT
# ----------------------------------------
# `pypi` is a GitHub environment whose single purpose is this upload. It does two things:
#
#   1. it narrows the OIDC grant. PyPI matches the token's `environment` claim, so a trusted
#      publisher registered with `pypi` will refuse a token minted for any other job in this
#      repository — including a job someone adds later without thinking about the index;
#   2. it carries REQUIRED REVIEWERS, and that is the human confirmation step for an irreversible
#      act. A PyPI upload cannot be undone: a yanked release still owns its filename forever, and
#      once any bytes have been `synapse_cdm-1.1.0-py3-none-any.whl` no other bytes can be. Every
#      other step of a release is revocable — a tag moves, a GitHub release deletes, a commit
#      reverts. This one is not, and it is the one this workflow was about to make automatic.
#
# The tag is a human act too, but not the same one: `git push --follow-tags` pushes tags as a side
# effect of pushing a branch, so the reviewer prompt is the first moment a person is asked about
# the UPLOAD specifically. The ruling and the case against it are in ledger entry 6, which is where
# it changes if it is revisited.
#
# The environment also carries a deployment branch policy of `v*` (tags only), which is a SECOND
# lock on the same door and on purpose. The `if:` on the publish job below is the first; it lives in
# this file, so a mistaken edit to this file removes it. The environment's policy lives outside this
# file and would still refuse a branch deployment. The one thing the environment is NOT is a second
# pair of eyes: `prevent_self_review` is off, because with one maintainer the only person who can
# push a tag is the only person who could approve it, and the stronger setting would be a deadlock
# rather than a review. This is a confirmation prompt. Entry 6 records that, and records that the
# setting should change the moment there is a second maintainer.
#
# THE RELEASE CONDITIONS, AND THE ONE THAT CANNOT RUN HERE
# -------------------------------------------------------
# `MIGRATIONS.md`'s "What a release requires" governs a CI build exactly as it governs a person at
# a terminal. Three of its four conditions run below, and one is named rather than skipped:
#
#   1. the suite is green ......... `pytest -q`, in `build`
#   2. the gate is green ......... `gates/wheel_install.py --mutation-check`, in `build`
#   3. the tag names the tree's `PACKAGE_VERSION` ... in `build`, on the tag event only, and this
#      one is STRONGER here than locally: CI knows the tag it was triggered by, so it compares the
#      ref against the version instead of trusting whoever typed `git tag`
#   4. the notes are derived, not remembered ....... CANNOT RUN HERE, and is not silently skipped.
#      Condition 4 is about a document a person publishes, and a workflow cannot satisfy it by
#      generating one — "derived" means the human writing the notes read the derivation off the
#      tree rather than off memory. What this workflow does instead is make the derivation FREE:
#      the `derivations` step prints the roster, the fixture counts and the schema list into the
#      run summary AND into the job log — both, since 2026-09-05, because only the log is readable
#      through `gh run view --log` and a witness round reads runs from a terminal — so the notes can
#      be copied from a run rather than recalled. That is the same
#      move entry 5 wishes had been made about its own skipped TestPyPI step: make the cheap thing
#      cheap instead of recording, afterwards, that nobody did it.
#
# The annotated-tag rule from the same section is also checked. MIGRATIONS says a lightweight tag
# "is a branch name that does not move, and it records nobody" — so a lightweight tag is refused
# here rather than published.
#
# ONE BUILD, NOT TWO
# ------------------
# The gate builds its own distribution and `--export-dist` hands it over; the `publish` job uploads
# exactly those bytes. The obvious alternative — `python -m build`, then run the gate — would
# produce two builds, and two builds of one tree are NOT the same file: the payloads are identical
# but the entries the build generates carry timestamps at a two-second zip resolution. Gating one
# and uploading the other is a gate that checked a file nobody installs. See `export_dist()`.
#
# NO IMPLICIT TESTPYPI
# --------------------
# There is no TestPyPI upload here, not even a disabled one. Entry 5 records that the 1.0.0 release
# skipped its own preview step and that this was discovered afterwards from a 404. The lesson taken
# is not "add a second silent upload" — a lane that fires on every tag alongside the real one is a
# second irreversible act nobody asked for. If a preview lane is wanted it goes in as its OWN
# explicit trigger with its own environment, so that running it is a decision and skipping it is
# visible.
#
# PINNED BY SHA, NOT BY TAG
# -------------------------
# Every `uses:` is a full commit SHA with the tag it corresponded to in a trailing comment. A tag
# is movable: `v1` and even `v1.14.2` can be repointed by whoever owns the action, and this
# workflow's entire purpose is provenance, so trusting a movable reference to establish it would
# reintroduce exactly what OIDC removes. Note that `pypa/gh-action-pypi-publish`'s release tags are
# ANNOTATED — the tag object's own SHA is not a commit SHA, and pinning that would pin a tag object.
# The value below is the commit the tag dereferences to.
#
# To update a pin: read the SHA off the release, put the new tag in the comment, and change both in
# the same commit.
#
# THE FILE BECAME A PIPELINE, 2026-09-08 (SOIF Part 1 round P7, spec §49–§55)
# ---------------------------------------------------------------------------
# Everything above this paragraph is unchanged and still true; what follows is an addition, in the
# tense this repository writes records in. Until today this file was two jobs — gate-and-build, then
# publish — and SOIF §50 fixes an ORDER with more stages than that: lint/type, conformance, security
# gates, clean install from the built package, package test, SBOM, hash, attestation, and after the
# upload a GitHub Release and a witness record. The stages are now one job per boundary, each
# `needs:` the one before it, so the order is enforced by the dependency graph rather than by the
# order steps happen to be written in:
#
#   gate -> build -> attest -> publish -> release -> witness
#
# THE FOUR CONDITIONS ARE VERBATIM AND THEY MOVED WITHOUT BEING EDITED. Conditions 1 and 3 and the
# annotated-tag check are `gate`'s; conditions 2 and 4 are `build`'s, because both of them read
# `dist/` and `dist/` is what `build` makes. Not one word of any of them changed, including the
# paragraph above that says condition 4 CANNOT RUN HERE — and that paragraph is still right. The
# `release` job renders notes with `synapse release-notes`, and rendering the nine mechanical fields
# is not the same act as satisfying condition 4: "derived" is a claim about what the WRITER read,
# `RELEASE_NOTES.md` is still written by a person, and the renderer REFUSES if that file describes
# another version. What changed is only that the nine fields can no longer be mistyped.
#
# WHY `attest` IS ITS OWN JOB AND NOT THE LAST STEPS OF `build`. §50 lists attestation as a stage,
# not as a job, and putting it in `build` would need `id-token: write` and `attestations: write` on
# the job that runs the build — the same objection the paragraph above makes to granting `id-token`
# at workflow level, one level down. `rc-build.yml` split it for this reason and this file follows
# it. The ORDER §50 fixes is unchanged; only the boundary is.
#
# WHAT A DISPATCH RUNS, AND WHAT IT STILL CANNOT DO. `workflow_dispatch` runs `gate`, `build` and
# `attest` and stops: `publish`, `release` and `witness` all carry the tag guard. So the whole
# pipeline short of the irreversible act is exercisable on a branch, which is how this round proved
# it — run 34220688516 on `soif/1.0`, green, with `publish` skipped.

# `Release`, and not `Publish to PyPI`, since 2026-09-08: the file no longer only publishes. The
# FILENAME is unchanged and that is the part that matters — PUBLICATION.md:540 records that PyPI's
# trusted publisher matches `publish.yml`, the path, and never the display name below.
name: Release

on:
  push:
    tags:
      - 'v*'
  # The build-and-gate half, runnable against any branch without publishing anything. This is what
  # makes the first half of this file testable before a release exists to test it with.
  workflow_dispatch:

# Read-only by default, and widened to `id-token: write` on the publish job alone. A workflow-level
# `id-token: write` would let every job in the file mint an OIDC token, including the one that runs
# the test suite.
#
# CORRECTED 2026-09-08 (round P7): "on the publish job alone" became false when §50's attestation
# stage landed, and the sentence is corrected here rather than edited, because the reasoning above
# it is exactly why the new grant is where it is. `id-token: write` is now on TWO jobs — `publish`,
# to mint the PyPI upload token, and `attest`, to mint the Sigstore signing token — and on neither
# of the two that run the suite or the build. `attestations: write` is on `attest` alone and
# `contents: write` on `release` and `witness` alone. The rule the sentence states is unchanged:
# the permission goes on the job that needs it and nowhere wider.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ §50: lint/type/test, conformance, security
  gate:
    name: Gate — lint, suite, conformance, security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The CodeQL gate below reads the analysis this commit already has. READ, not write: this job
      # judges a SARIF, it does not upload one — `codeql.yml` does that.
      security-events: read
    steps:
      - name: Check out the tree the tag points at
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags: `tests/test_cdm_release.py` re-derives every tag in history
          # against its tree's PACKAGE_VERSION, the annotated-tag check below reads the tag
          # OBJECT, and gitleaks §39 walks history rather than the checkout. A shallow clone has
          # none of the three, and each would pass vacuously rather than fail.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # NOT the declared floor, and the reason is in this file's history: `pyproject.toml`
          # declares `requires-python = ">=3.11"` and three of `tests/test_cdm_version_floor.py`'s
          # OWN self-tests fail on a genuine 3.11 interpreter, because they assert on the wording
          # of findings a 3.14 parser produces at `feature_version=(3, 11)`. The suite needs a host
          # ABOVE the floor to test the floor.
          python-version: '3.12'

      - name: Install what the suite and the gate need, by the documented path
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # CONTRIBUTING.md's setup command, verbatim. Using anything else here would be a mistake
          # with history: the first dispatch run of this workflow installed only `pytest twine` and
          # all 35 test modules failed collection on `No module named 'pydantic'`.
          python -m pip install -e "packages/cdm[test]"
          python -m pip install pip-audit

      - name: Lint — ruff, and the rule set is narrowed on purpose
        # §50's `lint/type` stage. F7.1's pre-ruled default was `E9,F`; the reading that decided the
        # actual set was taken at this round's Act 0 and is recorded in `packages/cdm/pyproject.toml`
        # beside the config: `E9` finds NOTHING in this tree and `F` finds 12 in the package and 47
        # repository-wide. A release-engineering round does not clean up 47 findings, and a stage
        # added red is a stage somebody disables. So the gate is `E9` — syntax errors and undefined
        # names, the class that is never a style opinion — and the `F` set is a known limitation
        # P8 §57 records rather than a rule this file pretends to enforce.
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.6"
          # `--config` explicitly, because there is no pyproject.toml at the repository ROOT: ruff
          # discovers configuration by walking up from each file, so `gates/` and `tests/` would
          # otherwise be linted under ruff's DEFAULT rule set while `packages/cdm/` used the
          # configured one — two rule sets in one command, and the stricter one applied to the two
          # directories nobody configured.
          ruff check --config packages/cdm/pyproject.toml packages/cdm gates tests

      - name: Condition 1 — the suite is green
        # `-rs` because a CI green is NOT the same green a maintainer sees, and the difference has
        # to be legible rather than hidden in one number. On a developer machine this suite reports
        # 2886 passed, 2 skipped; here it reported 2857 passed, 31 skipped. Same total. The 29
        # extra skips are by design: the pinned specification PDFs are gitignored and never
        # committed — 44 on a maintainer's disk, 0 tracked — so a fresh clone has the pin RECORDS
        # and not the documents, and `tests/test_cdm_pins.py` skips with a message saying exactly
        # that. Two more come from there being no in-clone virtualenv and no floor interpreter on
        # the runner.
        #
        # Nothing here is wrong, and the reason for `-rs` is that this is the shape of a real
        # defect too: a test that silently stops running in CI reports as a pass. The counts are
        # deliberately NOT asserted — a pinned number would fail on every added test, which is how
        # a gate gets deleted — so the skip list is printed and belongs to whoever reads the run.
        run: python -m pytest -q -rs

      - name: Condition 3 — the tag names this tree's PACKAGE_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(python -c 'import sys; sys.path.insert(0, "packages/cdm"); from synapse_cdm.version import PACKAGE_VERSION; print(PACKAGE_VERSION)')"
          echo "tag=${tag}  PACKAGE_VERSION=${version}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::${tag} points at a tree whose PACKAGE_VERSION is ${version}. MIGRATIONS.md condition 3: a tag that does not name its tree's version is a release nobody can reproduce. Delete the tag, fix one of the two, and tag again." >&2
            exit 1
          fi

      - name: The tag is annotated, never lightweight
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          kind="$(git cat-file -t "${GITHUB_REF_NAME}")"
          echo "${GITHUB_REF_NAME} is a ${kind}"
          if [ "${kind}" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag (git calls it a ${kind}). MIGRATIONS.md: a release is a statement by a person, and an annotated tag carries a tagger, a date and a message. A lightweight tag records nobody. Re-tag with git tag -a." >&2
            exit 1
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" \
            --format='tagger: %(taggername) %(taggerdate:iso8601)%0asubject: %(contents:subject)'

      - name: The published schemas are CURRENT
        # From the repository ROOT, which is where MIGRATIONS.md's sequence runs it and where the
        # published `schemas/` directory actually is. The first draft set
        # `working-directory: packages/cdm` on the assumption that a package's schemas live under
        # the package, and got six `missing` lines.
        run: python -m synapse_cdm.schemas --check --out schemas

      - name: The published manifests are CURRENT
        # Its sibling, and new here: §14's manifests are generated from the adapters and drift the
        # same way the schemas do. `--check` writes nothing and exits non-zero on a difference.
        run: python -m synapse_cdm.manifests --check

      - name: Conformance — the Suite v2 sweep, every shipped adapter, as ONE artefact
        # §50's `conformance` stage, and the artefact matters as much as the exit code: §52's notes
        # render their conformance summary from this file and §53's witness carries its SHA-256. A
        # sweep spelled as a shell loop over fourteen invocations produces fourteen documents whose
        # combination nothing can hash, which is why `--all` exists (round P7).
        #
        # `--require` names the checks that MUST pass. E, I and M are absent because they are
        # DECLARED INAPPLICABLE for some adapters and a SKIP among the required set exits non-zero
        # (§19) — requiring them would fail an adapter for not having an egress direction.
        run: |
          set -euo pipefail
          version="$(python -c 'from synapse_cdm.version import PACKAGE_VERSION; print(PACKAGE_VERSION)')"
          python -m synapse_cdm.suite conformance run --all \
            --require A,B,C,D,F,G,H,J,K,L,O --format json > "conformance-${version}.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(len(d["conformant"]), "of", len(d["adapters"]), "CONFORMANT")' "conformance-${version}.json"

      - name: Evidence records for every adapter, and the bundle the Release carries
        run: |
          set -euo pipefail
          version="$(python -c 'from synapse_cdm.version import PACKAGE_VERSION; print(PACKAGE_VERSION)')"
          python -m synapse_cdm.evidence provenance
          python -m synapse_cdm.evidence generate --all --out evidence
          find evidence -name evidence.json -print0 \
            | xargs -0 python -m synapse_cdm.evidence verify
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='UTC 1970-01-01' -czf "evidence-${version}.tar.gz" evidence
          sha256sum "evidence-${version}.tar.gz"

      - name: Security gate — gitleaks over the history this tag carries
        # The binary, pinned by version AND by the release artefact's SHA-256, for the reason
        # `ci.yml`'s own `secrets` job states: `gitleaks/gitleaks-action` requires a paid licence
        # for a repository owned by an ORGANIZATION, which this one is, so adding it would put a
        # job into the release path that fails for want of a licence key.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks git . --redact --config .gitleaks.toml --log-opts "--all"

      - name: Security gate — the exception allowlist, derived and printed before it is used
        # §45: DERIVED from `security/exceptions/` at run time and never typed into this file. An
        # audit that ignored a vulnerability without saying which is a green nobody can check.
        id: ignores
        run: |
          set -euo pipefail
          ignores="$(python gates/codeql_gate.py --emit-pip-audit-ignores)"
          echo "derived: [${ignores}]"
          echo "flags=${ignores}" >> "${GITHUB_OUTPUT}"

      - name: Security gate — pip-audit, strict
        # `--strict` makes a dependency pip-audit cannot resolve a FAILURE rather than a skipped
        # line; without it the audit passes on a package whose advisories were never fetched. The
        # identifiers in `flags` are constrained by `security/exceptions/schema.json`'s pattern to
        # characters no shell splits on, so the unquoted expansion is deliberate.
        #
        # THE AUDIT EXCLUDES EXACTLY ONE DISTRIBUTION AND IT IS THE PROJECT BEING RELEASED. M's
        # ruling of 2026-09-09, in one sentence: synapse-cdm cannot exist on PyPI at the version
        # being released, so requiring pip-audit to resolve that version creates a circular release
        # gate — the audit demands the publication the audit gates. It is not hypothetical. The
        # `Release` run on `v2.1.0` failed here with "synapse-cdm: Dependency not found on PyPI and
        # could not be audited: synapse-cdm (2.1.0)", `publish` never ran, and the version the run
        # refused to audit was the version that run existed to upload.
        #
        # WHY A FILTER AND NOT `--skip-editable`, WHICH IS THE FLAG THAT LOOKS LIKE THE ANSWER.
        # pip-audit 2.10.1 has the flag and it does not compose with `--strict`: a skipped
        # distribution IS a collection failure, so `pip-audit --strict --skip-editable` exits 1
        # with "synapse-cdm: distribution marked as editable". Reading taken 2026-09-09 in a clean
        # clone at this tree's version; dropping `--strict` instead is not on the table, because
        # `--strict` is what stops an unresolvable dependency from passing as a skipped line.
        #
        # WHY `pip list --format=freeze` AND NOT `pip freeze`. The exclusion has to be a filter on
        # the project's NAME, and `pip freeze` does not always write one: an editable install comes
        # out as `-e git+file://…#egg=synapse_cdm` and a wheel installed from a local file as
        # `synapse-cdm @ file:///…#sha256=…`. `pip list --format=freeze` writes `name==version` for
        # every distribution however it was installed, so one anchored pattern is the whole rule in
        # both jobs.
        #
        # WHAT THE PATTERN MAY AND MAY NOT DO. Anchored to the start of the line and to the
        # project's two PEP 503 spellings, closed by the `==` the export always writes; the number
        # of lines it removes is asserted to be EXACTLY ONE, so a second package can never go
        # unaudited without this step failing. No transitive dependency is excluded by it; every
        # third-party distribution stays under `--strict`; nothing reaches `--ignore-vuln` that
        # `security/exceptions/` did not derive; nothing else is skipped.
        #
        # WHAT STILL COVERS THE RELEASE CANDIDATE, so the exclusion is a scope and not a hole:
        # CodeQL, the repository suite, the conformance gates, dependency review, secret scanning
        # and the release qualification — and, once it is on the index, ordinary downstream
        # monitoring, which audits the published version like any other dependency.
        # `tests/test_cdm_security_exceptions.py` holds this step to exactly that scope and fails
        # on any exclusion wider than the project.
        run: |
          set -euo pipefail
          python -m pip list --format=freeze > environment.txt
          echo '--- the installed environment ---'
          cat environment.txt
          if ! grep -v -E '^synapse[-_]cdm==' environment.txt > environment-third-party.txt; then
            echo 'nothing is left to audit once the project under release is removed' >&2
            exit 1
          fi
          removed=$(( $(wc -l < environment.txt) - $(wc -l < environment-third-party.txt) ))
          echo "removed ${removed} line(s) naming the project under release"
          test "${removed}" -eq 1
          echo '--- the third-party set being audited ---'
          cat environment-third-party.txt
          # shellcheck disable=SC2086
          pip-audit --strict -r environment-third-party.txt ${{ steps.ignores.outputs.flags }}

      - name: Security gate — CodeQL, over the analysis this commit already has
        # §44 and M's amended threshold, applied by `gates/codeql_gate.py` — the SAME module
        # `codeql.yml` runs, over the SAME exceptions directory, so this stage cannot disagree with
        # the scan job about what blocks. What it adds is that the RELEASE refuses to proceed past
        # an unaddressed HIGH, which a scan job on another workflow cannot do.
        #
        # NO ANALYSIS IS A FAILURE AND NOT A PASS. A commit CodeQL has not looked at yet is a
        # commit whose findings are unknown, and "unknown" is the state this gate exists to refuse.
        #
        # THE QUERY IS SCOPED TO THE COMMIT AND NOT TO THE REF — round PQ, 2026-09-10, and the
        # reading is `Release` run 34452755466. `v2.1.1` was tagged on 4409115 and pushed; this
        # step asked `code-scanning/analyses?ref=${GITHUB_REF}`, which on a tag push is
        # `refs/tags/v2.1.1`, got `analyses on 4409115…: 0` and failed the release at step 16 of
        # 17. The commit HAD two analyses — 1753264364 and 1753266107, both on `refs/heads/main`,
        # both created five and a half minutes before the query — and `gates/codeql_gate.py` over
        # their SARIFs returns `0 result(s), 0 blocking`, exit 0. `codeql.yml` triggers on
        # `push`/`pull_request` to `main` and `soif/**` and a weekly cron and has no
        # `workflow_dispatch`, so NO ref of the form `refs/tags/*` can ever carry an analysis: the
        # ref filter made this step unpassable by every tag this repository will ever push, and
        # v2.1.1 was its first execution on a tag ref in the repository's history.
        #
        # So the filter is the commit SHA, which is what this step's own name has promised since
        # P7 wrote it. It is NOT a weakening (M's ruling of 2026-09-10, and the runner's fork
        # FQ.2 pre-ruled ACCEPTED): the gate still demands a real analysis for the exact release
        # commit and still runs the shared threshold module over it. What it stops doing is
        # caring which ref produced that analysis — including a pull-request or fork ref for the
        # same SHA, which is the same code scanned by the same query suite. `GITHUB_REF` is still
        # PRINTED, for the record; it no longer decides anything.
        #
        # The endpoint is PAGED, and the paging is BOUNDED: `MAX_PAGES` x `PER_PAGE` newest
        # analyses. The refusal message reports how many records were examined, because "0
        # analyses for this commit" is only honest if the reader is told how far the search
        # looked. The release commit's analyses are minutes old when this runs and the endpoint
        # returns newest first, so page 1 answers it in practice.
        #
        # `gates/release_ref_rehearsal.py` replays this query — and every other ref-dependent
        # release step — against the real API with the tag about to be pushed, BEFORE it is
        # pushed. That module is where a defect of this class is now caught; a tag is the one
        # thing this repository cannot un-spend.
        env:
          # `github.token`, NOT `secrets.GITHUB_TOKEN`. They are the same run-scoped token, and the
          # spelling is deliberate: this file states, in its header and in
          # `tests/test_cdm_trusted_publishing.py`, that it contains no `secrets.*` reference at
          # all — because `secrets.` is the namespace a pasted PyPI token would appear in, and a
          # rule with one permitted exception is a rule somebody extends during a failed release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "trigger ref: ${GITHUB_REF} (printed for the record; it does not filter the query below)"
          MAX_PAGES=5
          PER_PAGE=100
          : > analysis-ids.txt
          examined=0
          page=0
          while [ "${page}" -lt "${MAX_PAGES}" ]; do
            page=$(( page + 1 ))
            found="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?per_page=${PER_PAGE}&page=${page}" \
                       --jq "{examined: length, matched: [.[] | select(.commit_sha == \"${GITHUB_SHA}\") | .id]}")"
            examined=$(( examined + $(echo "${found}" | python -c 'import json,sys; print(json.load(sys.stdin)["examined"])') ))
            echo "${found}" \
              | python -c 'import json,sys; [print(i) for i in json.load(sys.stdin)["matched"]]' \
              >> analysis-ids.txt
            if [ "$(echo "${found}" | python -c 'import json,sys; print(json.load(sys.stdin)["examined"])')" -lt "${PER_PAGE}" ]; then
              break
            fi
          done
          count="$(grep -c . analysis-ids.txt || true)"
          echo "analyses on ${GITHUB_SHA}: ${count} (examined ${examined} record(s) over ${page} page(s); bound ${MAX_PAGES} x ${PER_PAGE})"
          if [ "${count}" -eq 0 ]; then
            echo "::error::CodeQL has produced no analysis of commit ${GITHUB_SHA}. ${examined} analysis record(s) were examined over ${page} page(s) of this repository's code-scanning analyses, newest first, bounded at ${MAX_PAGES} page(s) of ${PER_PAGE}, and none of them analysed this commit. A commit nobody has scanned is not a commit with no findings. This query does not care which ref produced the analysis, so the fix is to let codeql.yml finish on a BRANCH that contains ${GITHUB_SHA} — codeql.yml has no trigger under which the ref is a tag — and then re-run." >&2
            exit 1
          fi
          mkdir -p sarif
          while read -r id; do
            gh api -H "Accept: application/sarif+json" \
              "repos/${GITHUB_REPOSITORY}/code-scanning/analyses/${id}" > "sarif/${id}.sarif"
          done < analysis-ids.txt
          rm -f analysis-ids.txt
          python gates/codeql_gate.py sarif/*.sarif

      - name: Hand the gate's artefacts to the jobs that need them
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gate
          path: |
            conformance-*.json
            evidence-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------- §50: package build, clean install, package test, SBOM, hash
  build:
    name: Build, install clean, SBOM and hash
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tree the tag points at
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install what the suite and the gate need, by the documented path
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"
          # `twine` for the --strict metadata check below. `build` is deliberately NOT installed:
          # the gate provisions it into a venv of its own, and a second copy alongside would leave
          # which one built the published artefact depending on PATH.
          python -m pip install twine cyclonedx-bom

      - name: Condition 2 — the gate, including the mutation check
        run: |
          set -euo pipefail
          # --export-dist makes this the ONE build. It refuses to export on a failing run and
          # refuses to export a wheel with no fixtures in it, which is the shape the mutation
          # check builds deliberately.
          python gates/wheel_install.py --mutation-check --export-dist dist

      - name: The release artefacts, named from PACKAGE_VERSION and never from the ref
        # ROUND PS, 2026-09-08, on M's ruling: derive the expected wheel path from
        # PACKAGE_VERSION. `dist/` is what condition 2's `--export-dist` wrote, and every later
        # step in this job needs those two files BY NAME. Two ways of naming them were wrong. The
        # first was `dist/synapse_cdm-<the raw git ref>-py3-none-any.whl`, which stood in the
        # two SBOM steps below until this round: on the dispatch run that exercised them it named
        # `synapse_cdm-soif/1.0-py3-none-any.whl` and on a tag push it would name
        # `synapse_cdm-v2.1.0-py3-none-any.whl` — neither of them a file that has ever existed,
        # because a wheel is named by its packaging metadata and not by the ref that triggered the
        # build. The second is an unconstrained `dist/*.whl` glob, which cannot tell the release
        # wheel from anything else that lands in the directory and silently hashes whatever it
        # finds. So the version comes from the package, the two names are computed from it, and
        # the step refuses a `dist/` that does not hold exactly those two files.
        run: |
          set -euo pipefail
          version="$(python -c 'from synapse_cdm.version import PACKAGE_VERSION; print(PACKAGE_VERSION)')"
          wheel="dist/synapse_cdm-${version}-py3-none-any.whl"
          sdist="dist/synapse_cdm-${version}.tar.gz"
          held="$(ls dist | wc -l | tr -d ' ')"
          if [ "${held}" != "2" ]; then
            echo "::error::dist/ holds ${held} files and a release is exactly two, the wheel and the sdist. Anything else makes every digest below ambiguous: $(ls dist | tr '\n' ' ')" >&2
            exit 1
          fi
          for artefact in "${wheel}" "${sdist}"; do
            if [ ! -f "${artefact}" ]; then
              echo "::error::${artefact} does not exist. PACKAGE_VERSION is ${version} and dist/ holds: $(ls dist | tr '\n' ' '). An artefact path is derived from the package's own version, so a mismatch here is a build that produced something else." >&2
              exit 1
            fi
          done
          mkdir -p sbom
          {
            echo "VERSION=${version}"
            echo "WHEEL=${wheel}"
            echo "SDIST=${sdist}"
          } >> "${GITHUB_ENV}"
          ls -l "${wheel}" "${sdist}"

      - name: twine check --strict, on the bytes that were gated
        run: |
          set -euo pipefail
          ls -l dist
          python -m twine check --strict "${WHEEL}" "${SDIST}"

      - name: Clean install from the built package, in a venv of its own
        # §50's `clean install from built package`, as a PIPELINE stage rather than only as
        # `gates/wheel_install.py`'s internal act. The difference is what it installs FROM: the
        # gate builds its own wheel in a temporary directory, and this installs the exact file
        # that is about to be uploaded, in an interpreter that has never seen the source tree.
        #
        # ROUND PS, 2026-09-08: this environment is now also THE SUBJECT OF THE RELEASE SBOM, so
        # the step exports its path and the SBOM steps below read that variable rather than naming
        # a directory of their own. It is the environment M's ruling describes — the clean install
        # created from the gated wheel — and it holds the release's runtime closure and nothing
        # else. The gate's own internal venv is not usable for this: it is deleted when the gate
        # returns unless `--keep` is passed, its path is printed rather than exported, and by the
        # time the gate has finished with it the `slice` check has installed `pytest` into it, so
        # an SBOM taken there would describe a test environment as a release.
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install "${WHEEL}"
          echo "CLEAN_VENV=/tmp/clean" >> "${GITHUB_ENV}"
          /tmp/clean/bin/python -m pip list --format=freeze
          # From `/tmp`, so that an accidental import of the source tree cannot pass for the wheel.
          cd /tmp
          /tmp/clean/bin/python -c "import synapse_cdm; print(synapse_cdm.__file__)"

      - name: Package test — the installed wheel answers for itself
        # §50's `package test`: not the suite again, but the things a CONSUMER does with the
        # artefact — the console scripts resolve, the packaged fixtures and schemas are inside the
        # wheel, and the conformance sweep runs from the installed package with no repository
        # anywhere near it.
        run: |
          set -euo pipefail
          cd /tmp
          /tmp/clean/bin/synapse conformance list
          /tmp/clean/bin/synapse conformance run --all --require A,B,C,D,F,G,H,J,K,L,O \
            --format json > /tmp/installed-conformance.json
          /tmp/clean/bin/python -c 'import json; d=json.load(open("/tmp/installed-conformance.json")); assert d["conformant"] == sorted(d["adapters"]), d["conformant"]; print(len(d["conformant"]), "adapters CONFORMANT from the installed wheel")'
          /tmp/clean/bin/cdm-harness --list-adapters

      - name: SBOM — SPDX, from syft over the clean-install environment
        # ROUND PS, 2026-09-08, on M's ruling of the same day. syft reads THE ENVIRONMENT the
        # gated wheel was installed into, and the reason is a reading rather than a preference:
        # syft over a `.whl` FILE enumerates one SPDX package — the filename — and zero CycloneDX
        # components, so the step this replaces would have published, greenly, an SBOM that named
        # no dependency of anything. Over the clean venv the same syft version catalogues the
        # installed distribution and its whole runtime closure with the licence each one declares.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: ${{ env.CLEAN_VENV }}
          format: spdx-json
          output-file: sbom/synapse_cdm.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM — CycloneDX, from the same syft run
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: ${{ env.CLEAN_VENV }}
          format: cyclonedx-json
          output-file: sbom/synapse_cdm.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM cross-check — cyclonedx-py over the same environment
        # TWO PRODUCERS, and the second is a cross-check rather than a second release artefact
        # (P6's pre-ruled default 4: "the release artefacts are syft's", `rc-build.yml`). M's
        # ruling of 2026-09-08 names this tool over THIS environment, and the value is that the
        # two read it differently: syft catalogues the directory, `cyclonedx-py environment` asks
        # the interpreter what is importable in it. A distribution in one and not the other is a
        # real discrepancy, and neither tool can report it alone.
        #
        # It writes OUTSIDE `sbom/`: everything in that directory is hashed into `SHA256SUMS` and
        # handed to the release job, and a cross-check is not an artefact of the release. The
        # difference is printed and never asserted empty — syft's document also carries file and
        # application components, which `cyclonedx-py` has no notion of.
        run: |
          set -euo pipefail
          cyclonedx-py environment "${CLEAN_VENV}/bin/python" \
            --output-format JSON --output-file /tmp/environment.cdx.json
          python - sbom/synapse_cdm.cdx.json /tmp/environment.cdx.json <<'PY'
          import json
          import sys

          def libraries(path):
              document = json.load(open(path))
              return {(component["name"], component.get("version")) for component
                      in (document.get("components") or [])
                      if component.get("type") == "library"}

          syft, native = libraries(sys.argv[1]), libraries(sys.argv[2])
          print(f"syft: {len(syft)} library components; cyclonedx-py: {len(native)}")
          for label, difference in (("only syft", syft - native), ("only cyclonedx-py", native - syft)):
              print(f"{label}: {sorted(difference)}")
          PY

      - name: The SBOMs describe this release, or the pipeline stops
        # §46 asks a release for an SBOM. A file that PARSES as one and describes nothing meets
        # the letter of that and none of its point, which is exactly what the wheel-file SBOM
        # above was: the four refusals below are M's ruling of 2026-09-08 written as assertions —
        # synapse-cdm absent, its version not PACKAGE_VERSION, zero components, or a generation
        # step that failed (`set -euo pipefail`, and a missing file raises here). The cross-check
        # document is held to the same two facts; it is not a release artefact, but a cross-check
        # that disagrees about the version of the package being released is not a cross-check.
        #
        # The name is normalised PEP 503 style because the two tools need not agree with each
        # other: syft reports the installed distribution's name and cyclonedx-py the metadata's,
        # and either may spell it `synapse_cdm`.
        run: |
          set -euo pipefail
          python - "${VERSION}" sbom/synapse_cdm.spdx.json sbom/synapse_cdm.cdx.json /tmp/environment.cdx.json <<'PY'
          import json
          import re
          import sys

          version, spdx_path, cdx_path, cross_path = sys.argv[1:5]


          def normalise(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name or "").lower()


          def refuse(message: str) -> None:
              print(f"::error::{message}. SOIF Part 1 §46, round PS: the release SBOM describes "
                    "the clean-install environment created from the gated wheel, and one that "
                    "cannot name the package being released describes nothing.", file=sys.stderr)
              raise SystemExit(1)


          spdx = json.load(open(spdx_path))
          cdx = json.load(open(cdx_path))
          cross = json.load(open(cross_path))
          packages = spdx.get("packages") or []
          components = cdx.get("components") or []
          if not packages:
              refuse(f"{spdx_path} carries no packages[] entry at all")
          if not components:
              refuse(f"{cdx_path} carries no components[] entry at all")

          for path, entries, field in ((spdx_path, packages, "versionInfo"),
                                       (cdx_path, components, "version"),
                                       (cross_path, cross.get("components") or [], "version")):
              versions = {entry.get(field) for entry in entries
                          if normalise(entry.get("name", "")) == "synapse-cdm"}
              if not versions:
                  refuse(f"{path} names no synapse-cdm entry among its {len(entries)}")
              if versions != {version}:
                  refuse(f"{path} carries synapse-cdm at {sorted(map(str, versions))} and this "
                         f"tree's PACKAGE_VERSION is {version}")

          print(f"SPDX: {len(packages)} packages. CycloneDX: {len(components)} components. "
                f"synapse-cdm at {version} in both, and in the cross-check.")
          PY

      - name: Fetch the gate's conformance and evidence artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gate
          path: gate/

      - name: Hash — one SHA256SUMS over every artefact this release publishes
        # §50's `hash` stage. Everything the Release carries is in one table, so a consumer checks
        # one file rather than six, and `gates/witness_verify.py` reads the same digests back out
        # of the witness record afterwards.
        run: |
          set -euo pipefail
          cp gate/conformance-*.json gate/evidence-*.tar.gz .
          sha256sum "${WHEEL}" "${SDIST}" sbom/*.json conformance-*.json evidence-*.tar.gz \
            | tee SHA256SUMS
          {
            echo '## Artefacts, with digests'
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Condition 4 — the derivations, for notes that are derived and not remembered
        # THE BLOCK GOES TO THE JOB LOG AS WELL AS THE STEP SUMMARY, and `tee -a` rather than `>>`
        # is the whole of the change (2026-09-05). A step summary is rendered on the run's page and
        # is NOT part of `gh run view --log`, so the one route a later round can read the
        # derivations back through did not carry them: a witness round reconciling what the notes
        # claim against what the run derived had to be a person looking at a web page, and a
        # reading nobody can take from a terminal is a reading that gets remembered instead. The
        # log already carries the digests twice over — the gate's `--export-dist` line and the
        # publish job's pre-upload hashes — and this makes the roster, the schema list and the
        # suite's own tail readable the same way. Nothing about condition 4 changes: it is still a
        # person's, and the workflow still only makes the derivation free.
        run: |
          set -euo pipefail
          {
            echo '## Derived facts for the release notes'
            echo
            echo 'MIGRATIONS.md condition 4 requires every claim in a release'"'"'s notes to be'
            echo 'readable off the tree at the tag. This workflow cannot write the notes — it can'
            echo 'only make the derivation free. Copy from here rather than from memory.'
            echo
            echo '### Artefacts, with digests'
            echo
            echo '```'
            (cd dist && sha256sum ./*) || (cd dist && shasum -a 256 ./*)
            echo '```'
            echo
            echo '### The adapter roster'
            echo
            echo '```'
            PYTHONPATH=packages/cdm python -m synapse_cdm.harness --list-adapters
            echo '```'
            echo
            echo '### The schemas'
            echo
            echo '```'
            ls -1 schemas
            echo '```'
            echo
            echo '### The suite, as this runner saw it'
            echo
            echo 'A CI green is not a maintainer'"'"'s green: the pinned specification PDFs are'
            echo 'gitignored, so a fresh clone skips the tests that read them. The skip list is in'
            echo 'the "Condition 1" step'"'"'s log, printed with `-rs`.'
            echo
            echo '```'
            python -m pytest -q -rs 2>&1 | tail -1
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Hand the gated artefacts to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Hand the release assets to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: assets
          path: |
            sbom/*.json
            SHA256SUMS
            conformance-*.json
            evidence-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------------------ §50: attestation
  attest:
    name: Build provenance, and the verification that proves it
    needs: build
    runs-on: ubuntu-latest
    outputs:
      # The instant the attestations were actually verified, carried to the `witness` job. Without
      # it that job would have to write the RELEASE's instant into `attestation.verified_at`,
      # which is a different event — and a record whose fields are approximately right is the
      # thing §53's "verifiable" exists to rule out.
      verified_at: ${{ steps.verify.outputs.verified_at }}
    permissions:
      # Narrow, and on this job alone. `id-token: write` is the OIDC token Sigstore signs with and
      # `attestations: write` is the attestation store; granting either to the job that runs the
      # suite would let anything the suite imports mint one.
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: artefacts/dist/

      - name: Download the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: assets
          path: artefacts/

      - name: The digests survived the hand-off
        # Between two jobs the artefacts go through an upload and a download, and this is where a
        # truncated transfer is caught — before an attestation is minted over the wrong bytes.
        run: |
          set -euo pipefail
          cd artefacts && sha256sum -c SHA256SUMS

      - name: Attest the wheel, the sdist, both SBOMs and the evidence bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artefacts/dist/*
            artefacts/sbom/synapse_cdm.spdx.json
            artefacts/sbom/synapse_cdm.cdx.json
            artefacts/evidence-*.tar.gz

      - name: Verify each attestation — the proof, not the claim
        id: verify
        # §47's chain ends in an attestation, and an attestation nobody verified is a file. This
        # runs the same command a consumer runs, in the same run that produced it, so a broken
        # chain fails HERE rather than in somebody else's audit.
        env:
          # `github.token`, NOT `secrets.GITHUB_TOKEN`. They are the same run-scoped token, and the
          # spelling is deliberate: this file states, in its header and in
          # `tests/test_cdm_trusted_publishing.py`, that it contains no `secrets.*` reference at
          # all — because `secrets.` is the namespace a pasted PyPI token would appear in, and a
          # rule with one permitted exception is a rule somebody extends during a failed release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artefact in artefacts/dist/* artefacts/sbom/*.json artefacts/evidence-*.tar.gz; do
            echo "::group::verify $artefact"
            gh attestation verify "$artefact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish.yml"
            echo "::endgroup::"
          done
          echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

  # ------------------------------------------------------------------------------------------ §50/§51: publish
  publish:
    name: Publish to PyPI over OIDC
    # Only after the whole gate chain passed, and only for a tag. A dispatch run reaches this job
    # and is skipped, which is deliberate: it is what makes everything above it exercisable on a
    # branch. `needs: attest` is the END of the chain gate -> build -> attest, so this job cannot
    # start before any of them; `tests/test_cdm_trusted_publishing.py` walks the chain rather than
    # reading one name, because the name of the job immediately before this one is not the
    # property that matters.
    needs: attest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # The environment is the gate. Its required reviewers hold this job until a person approves,
    # and its name is half of what PyPI matches the OIDC token against. It MUST equal the
    # "Environment name" registered on the PyPI publisher — `tests/test_cdm_trusted_publishing.py`
    # requires this string and ledger entry 6's to be the same string, because two statements of
    # one fact drift at whichever site is edited alone.
    environment:
      name: pypi
      url: https://pypi.org/project/synapse-cdm/

    permissions:
      # The whole mechanism, in one line: this is what lets the job ask GitHub for a short-lived
      # token that names this repository, this workflow file and this environment. There is no
      # `password:` on the publish step below and no secret in this file.
      id-token: write

    steps:
      - name: Fetch the artefacts the gate passed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: What is about to be uploaded
        run: |
          set -euo pipefail
          ls -l dist
          sha256sum dist/* || shasum -a 256 dist/*
          echo 'PyPI filenames are permanent. A yank hides a release; it does not free the name.'

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          # No `password:`, no `user:`, no `repository-url:`. The default target is PyPI and the
          # credential is the OIDC token minted by `id-token: write` above. If this step ever grows
          # a `password:` line, Trusted Publishing has been abandoned and ledger entry 6 is wrong.
          print-hash: true
          attestations: true

  # ------------------------------------------------------------------------------------- §52: GitHub Release
  release:
    name: GitHub Release, with notes rendered from the tree
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The only job in this file that writes to the repository, and it writes a Release rather
      # than a commit: RUNNER.md's hard limits keep committing a runner's act, and §53's witness
      # record is committed by the witness round for exactly that reason.
      contents: write
    steps:
      - name: Check out the tree the tag points at
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the package, for the renderer
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"

      - name: Download the distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: assets
          path: assets/

      - name: Render the notes — §52's ten fields, nine of them derived
        # The tenth is `RELEASE_NOTES.md`'s prose, quoted. The renderer REFUSES if that file
        # describes another version, which is the §52 failure with no visible symptom: a heading
        # carrying the right number over prose about the previous release.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python -m synapse_cdm.suite release-notes \
            --version "${version}" \
            --from RELEASE_NOTES.md \
            --manifests manifests \
            --conformance "assets/conformance-${version}.json" \
            --security SECURITY.md \
            --exceptions security/exceptions \
            --codeql "0 findings at or above 7.0, gate green in this run" \
            --pip-audit "0 findings, strict, in this run" \
            --out "release-notes-${version}.md"
          sha256sum "release-notes-${version}.md"

      - name: Create the Release, with the full asset set
        # F7.4's default. Evidence and conformance are ASSETS and not merely workflow artefacts,
        # because a workflow artefact expires in 90 days and a release's evidence should outlive
        # the run that produced it — `evidence.available` becoming true for a consumer who cannot
        # run this package is exactly what the attachment is for.
        env:
          # `github.token`, NOT `secrets.GITHUB_TOKEN`. They are the same run-scoped token, and the
          # spelling is deliberate: this file states, in its header and in
          # `tests/test_cdm_trusted_publishing.py`, that it contains no `secrets.*` reference at
          # all — because `secrets.` is the namespace a pasted PyPI token would appear in, and a
          # rule with one permitted exception is a rule somebody extends during a failed release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "synapse-cdm ${version}" \
            --notes-file "release-notes-${version}.md" \
            --verify-tag \
            dist/* \
            assets/SHA256SUMS \
            assets/sbom/synapse_cdm.spdx.json \
            assets/sbom/synapse_cdm.cdx.json \
            "assets/evidence-${version}.tar.gz" \
            "assets/conformance-${version}.json" \
            "release-notes-${version}.md"

  # -------------------------------------------------------------------------------------- §53: witness entry
  witness:
    name: Witness record, from the index and the Release
    # `release` is the stage before it; `attest` is named as well only so that
    # `needs.attest.outputs.verified_at` is readable here. The order §50 fixes is unchanged —
    # `release` already depends on `attest` transitively.
    needs: [release, attest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tree the tag points at
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Download the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: assets
          path: assets/

      - name: Build the witness record from what was actually published
        # AFTER the upload and AFTER the Release, because every field in it is a reading of
        # something that did not exist before: PyPI's own digests, the Release's id and instant,
        # and the approval that released the hold. A record assembled from what the pipeline
        # INTENDED to publish would agree with itself and prove nothing.
        env:
          # `github.token`, NOT `secrets.GITHUB_TOKEN`. They are the same run-scoped token, and the
          # spelling is deliberate: this file states, in its header and in
          # `tests/test_cdm_trusted_publishing.py`, that it contains no `secrets.*` reference at
          # all — because `secrets.` is the namespace a pasted PyPI token would appear in, and a
          # rule with one permitted exception is a rule somebody extends during a failed release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > approvals.json || echo '[]' > approvals.json
          python .github/scripts/build_witness.py \
            --version "${version}" \
            --commit "${GITHUB_SHA}" \
            --tag "${GITHUB_REF_NAME}" \
            --tag-object "$(git rev-parse "${GITHUB_REF_NAME}")" \
            --release release.json \
            --approvals approvals.json \
            --assets assets \
            --attestation-verified \
            --attestation-verified-at "${{ needs.attest.outputs.verified_at }}" \
            --out "witness-${version}.json"

      - name: Verify it — §53's "deterministic and verifiable", as a command
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python gates/witness_verify.py "witness-${version}.json" --download

      - name: Attach it to the Release
        # It is NOT committed here. A workflow does not commit to `main` (RUNNER.md's hard limits);
        # the witness round commits the same file under `releases/witness/` alongside
        # PUBLICATION.md's ledger entry.
        env:
          # `github.token`, NOT `secrets.GITHUB_TOKEN`. They are the same run-scoped token, and the
          # spelling is deliberate: this file states, in its header and in
          # `tests/test_cdm_trusted_publishing.py`, that it contains no `secrets.*` reference at
          # all — because `secrets.` is the namespace a pasted PyPI token would appear in, and a
          # rule with one permitted exception is a rule somebody extends during a failed release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" "witness-${version}.json"
          {
            echo '## The witness record'
            echo
            echo 'Commit this to `releases/witness/'"${version}"'.json` in the witness round.'
            echo
            echo '```json'
            cat "witness-${version}.json"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
