# Release-candidate build — SOIF Part 1 §47's provenance chain and §48's artefact set, as ONE
# dispatchable workflow. Round P6.
#
# WHAT §48 ASKS FOR, AND WHY IT IS A FILE OF ITS OWN
# ---------------------------------------------------
# §48: "A local/release-candidate build SHALL produce: package artifact; hash; SBOM;
# provenance/attestation evidence; conformance evidence." All five, from one dispatch, on any ref —
# without publishing anything and without a tag.
#
# The round's brief asks for the SBOM and attestation steps "in `ci.yml`'s build job". **`ci.yml`
# has no build job** — its five jobs are `suite`, `conformance`, `evidence`, `secrets` and
# `supply-chain`, none of which builds a distribution, and `publish.yml`'s build job is a release
# pipeline that round P7 owns and this round must not touch. So the composition lives here, which
# is the alternative the brief itself names. Three reasons it is the better half of that choice:
#
#   * §48 asks for ONE run that produces the whole set. In `ci.yml` the set would be spread across
#     jobs that run on every push, and attestation needs `id-token: write` — a permission that has
#     no business being reachable on every pull request from a fork.
#   * A release CANDIDATE is a thing you ask for. `workflow_dispatch` is that; `push` is not.
#   * P7 restructures `publish.yml` around exactly this order (§50) and takes this workflow's
#     first run as its Act 0 reading. Keeping the composition in one readable file is what makes
#     that comparison possible.
#
# THE CHAIN §47 DRAWS, WITH THE JOB THAT REALISES EACH ARROW
# -----------------------------------------------------------
#   source commit -> CI            `qualify`, at the dispatched ref, `fetch-depth: 0`
#   CI            -> tests         `qualify`, step "The suite"
#   tests         -> conformance   `qualify`, steps "Conformance Suite v2" and "Evidence records"
#   conformance   -> build         `build` needs `qualify`; a red suite builds nothing
#   build         -> SBOM          `build`, syft over the clean install created from the gated wheel
#   SBOM          -> artefact hash `build`, one sha256 table over dist/ and the SBOMs
#   artefact hash -> attestation   `attest` needs `build`; attests the exact uploaded bytes
#   attestation   -> (proof)       `attest`, `gh attestation verify` on each artefact
#
# `docs/docs/security/supply-chain.mdx` carries the same table, and a test compares the two so
# that a job renamed here cannot leave the documentation describing a workflow that no longer
# exists.
name: RC build

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this candidate is being built (recorded in the job summary)'
        required: false
        default: 'release-candidate qualification'

permissions:
  contents: read

concurrency:
  group: rc-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Suite, conformance and evidence at this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: `tests/test_cdm_release.py` re-derives every tag against its tree's
          # PACKAGE_VERSION and `gates/bump_derivation.py` reads the arc since the last tag. A
          # shallow clone makes both pass vacuously, which on a release candidate is the reading
          # that matters least being the one that cannot fail.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install by the documented path
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"

      - name: The suite
        run: python -m pytest -q -rs

      - name: Conformance Suite v2, every shipped adapter, check O required
        # The roster is asked of the package rather than written down, for the reason `ci.yml`'s
        # own sweep gives at length: an enumerated roster in this repository has gone stale every
        # time one has been written.
        run: |
          set -euo pipefail
          for adapter in $(python -c "from synapse_cdm.adapter import roster; print(' '.join(roster()))"); do
            echo "::group::$adapter"
            python -m synapse_cdm.suite conformance run --adapter "$adapter" \
              --require A,B,C,D,F,G,H,J,K,L,O
            echo "::endgroup::"
          done

      - name: Evidence records — §48's "conformance evidence"
        run: |
          set -euo pipefail
          python -m synapse_cdm.evidence provenance
          python -m synapse_cdm.evidence generate --all --out evidence
          find evidence -name evidence.json -print0 \
            | xargs -0 python -m synapse_cdm.evidence verify

      - name: Upload the conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rc-evidence
          path: evidence/
          if-no-files-found: error

  build:
    name: Gated build, SBOMs and hashes
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install what the gate and the checks need
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "packages/cdm[test]"
          # `twine` for the metadata check; `cyclonedx-bom` for the Python-native SBOM
          # cross-check below. `build` is deliberately NOT installed: the gate provisions it into
          # a venv of its own, and a second copy alongside would leave which one built the
          # published artefact depending on PATH (`publish.yml` states the same reason).
          python -m pip install twine cyclonedx-bom

      - name: The gate, including the mutation check — and this is the ONE build
        # `--export-dist` is what makes it one build: the gate builds its own distribution, so a
        # workflow that ran `python -m build` and then ran the gate would produce two files that
        # are not byte-identical (see `export_dist()`'s docstring for the two digests that proved
        # it). The exported bytes are the bytes the 13 checks passed, and they are the bytes
        # every later step in this workflow hashes, bills of material, and attests.
        run: |
          set -euo pipefail
          python gates/wheel_install.py --mutation-check --export-dist dist

      - name: The release artefacts, named from PACKAGE_VERSION and never from the ref
        # `publish.yml`'s step of the same name, verbatim (round PS's ruling): the two names are
        # computed from the package's own version, every later step reads them by name, and a
        # `dist/` that does not hold exactly those two files is refused.
        run: |
          set -euo pipefail
          version="$(python -c 'from synapse_cdm.version import PACKAGE_VERSION; print(PACKAGE_VERSION)')"
          wheel="dist/synapse_cdm-${version}-py3-none-any.whl"
          sdist="dist/synapse_cdm-${version}.tar.gz"
          held="$(ls dist | wc -l | tr -d ' ')"
          if [ "${held}" != "2" ]; then
            echo "::error::dist/ holds ${held} files and a release candidate is exactly two, the wheel and the sdist. Anything else makes every digest below ambiguous: $(ls dist | tr '\n' ' ')" >&2
            exit 1
          fi
          for artefact in "${wheel}" "${sdist}"; do
            if [ ! -f "${artefact}" ]; then
              echo "::error::${artefact} does not exist. PACKAGE_VERSION is ${version} and dist/ holds: $(ls dist | tr '\n' ' '). An artefact path is derived from the package's own version, so a mismatch here is a build that produced something else." >&2
              exit 1
            fi
          done
          mkdir -p sbom
          {
            echo "VERSION=${version}"
            echo "WHEEL=${wheel}"
            echo "SDIST=${sdist}"
          } >> "${GITHUB_ENV}"
          ls -l "${wheel}" "${sdist}"

      - name: twine check --strict, on the bytes that were gated
        run: |
          set -euo pipefail
          ls -l dist
          python -m twine check --strict "${WHEEL}" "${SDIST}"

      - name: Clean install from the built package, in a venv of its own
        # THE SUBJECT OF THE SBOMs BELOW, as in `publish.yml` since round PS (2026-09-08) and here
        # since 2026-09-16. Until then this workflow took both SBOMs with syft over `dist`, the
        # shape `publish.yml` records as yielding one SPDX package — the filename — and zero
        # CycloneDX components: a bill of materials naming no dependency of anything, attested and
        # uploaded green. The clean venv holds the gated wheel and its runtime closure and nothing
        # else, in an interpreter that has never seen the source tree.
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install "${WHEEL}"
          echo "CLEAN_VENV=/tmp/clean" >> "${GITHUB_ENV}"
          /tmp/clean/bin/python -m pip list --format=freeze
          # From `/tmp`, so that an accidental import of the source tree cannot pass for the wheel.
          cd /tmp
          /tmp/clean/bin/python -c "import synapse_cdm; print(synapse_cdm.__file__)"

      - name: SBOM — SPDX, from syft over the clean-install environment
        # syft reads THE ENVIRONMENT the gated wheel was installed into — not the wheel file,
        # which catalogues as one package with no dependencies, and not the runner's own
        # environment, which carries the `test` extra and would describe the runner.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: ${{ env.CLEAN_VENV }}
          format: spdx-json
          output-file: sbom/synapse_cdm.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM — CycloneDX, from the same syft run
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: ${{ env.CLEAN_VENV }}
          format: cyclonedx-json
          output-file: sbom/synapse_cdm.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM cross-check — cyclonedx-py over the same environment
        # TWO PRODUCERS, and the second is a cross-check rather than a second release artefact
        # (M's pre-ruled default 4: "the release artefacts are syft's"). The value is that the
        # two read the SAME environment differently: syft catalogues the directory,
        # `cyclonedx-py environment` asks the interpreter what is importable in it. A distribution
        # in one and not the other is a real discrepancy, and neither tool can report it alone.
        #
        # It writes OUTSIDE `sbom/`: everything in that directory is hashed into `SHA256SUMS` and
        # attested, and a cross-check is not an artefact of the candidate. (Until 2026-09-16 it
        # wrote `sbom/environment.cdx.json`, over the runner's own environment, and that file was
        # hashed and uploaded beside the two release documents.) The difference is printed and
        # never asserted empty — syft's document also carries file and application components,
        # which `cyclonedx-py` has no notion of.
        run: |
          set -euo pipefail
          cyclonedx-py environment "${CLEAN_VENV}/bin/python" \
            --output-format JSON --output-file /tmp/environment.cdx.json
          python - sbom/synapse_cdm.cdx.json /tmp/environment.cdx.json <<'PY'
          import json
          import sys

          def libraries(path):
              document = json.load(open(path))
              return {(component["name"], component.get("version")) for component
                      in (document.get("components") or [])
                      if component.get("type") == "library"}

          syft, native = libraries(sys.argv[1]), libraries(sys.argv[2])
          print(f"syft: {len(syft)} library components; cyclonedx-py: {len(native)}")
          for label, difference in (("only syft", syft - native), ("only cyclonedx-py", native - syft)):
              print(f"{label}: {sorted(difference)}")
          PY

      - name: The SBOMs describe this release, or the pipeline stops
        # `publish.yml`'s four refusals, verbatim — M's ruling of 2026-09-08 written as
        # assertions: synapse-cdm absent, its version not PACKAGE_VERSION, zero components, or a
        # generation step that failed (`set -euo pipefail`, and a missing file raises here). A
        # file that PARSES as an SBOM and describes nothing meets the letter of §46 and none of its
        # point, which is what this workflow's wheel-file SBOM was.
        run: |
          set -euo pipefail
          python - "${VERSION}" sbom/synapse_cdm.spdx.json sbom/synapse_cdm.cdx.json /tmp/environment.cdx.json <<'PY'
          import json
          import re
          import sys

          version, spdx_path, cdx_path, cross_path = sys.argv[1:5]


          def normalise(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name or "").lower()


          def refuse(message: str) -> None:
              print(f"::error::{message}. SOIF Part 1 §46, round PS: the release SBOM describes "
                    "the clean-install environment created from the gated wheel, and one that "
                    "cannot name the package being released describes nothing.", file=sys.stderr)
              raise SystemExit(1)


          spdx = json.load(open(spdx_path))
          cdx = json.load(open(cdx_path))
          cross = json.load(open(cross_path))
          packages = spdx.get("packages") or []
          components = cdx.get("components") or []
          if not packages:
              refuse(f"{spdx_path} carries no packages[] entry at all")
          if not components:
              refuse(f"{cdx_path} carries no components[] entry at all")

          for path, entries, field in ((spdx_path, packages, "versionInfo"),
                                       (cdx_path, components, "version"),
                                       (cross_path, cross.get("components") or [], "version")):
              versions = {entry.get(field) for entry in entries
                          if normalise(entry.get("name", "")) == "synapse-cdm"}
              if not versions:
                  refuse(f"{path} names no synapse-cdm entry among its {len(entries)}")
              if versions != {version}:
                  refuse(f"{path} carries synapse-cdm at {sorted(map(str, versions))} and this "
                         f"tree's PACKAGE_VERSION is {version}")

          print(f"SPDX: {len(packages)} packages. CycloneDX: {len(components)} components. "
                f"synapse-cdm at {version} in both, and in the cross-check.")
          PY

      - name: Hashes — §48's "hash", over every artefact this run produced
        # `inputs.reason` reaches the shell through `env:` and never through `${{ }}` inside
        # `run:`. An expression expanded into a script is spliced into the script's TEXT before
        # bash reads it, so a dispatch input of `"; curl …` would run — a dispatch input is free
        # text typed by whoever holds write, and the whole point of least privilege is that "who
        # holds write" is not the last line of defence. An environment variable is data to bash.
        # Found and closed by audit remediation F08 (2026-09-20); `tests/test_cdm_governance.py`
        # holds every `run:` block in every workflow to the same rule.
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          {
            echo '## RC build — artefacts and digests'
            echo
            echo "Ref \`${GITHUB_REF}\` at commit \`${GITHUB_SHA}\`."
            echo "Reason: ${REASON}"
            echo
            echo '```'
            sha256sum dist/* sbom/*
            echo '```'
            echo
            echo 'The wheel and sdist above are the bytes `gates/wheel_install.py` passed 13'
            echo 'checks on and exported; nothing in this workflow rebuilds them.'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          sha256sum dist/* sbom/* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rc-dist
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

      - name: Upload the SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rc-sbom
          path: sbom/
          if-no-files-found: error

  attest:
    name: Build provenance, and the verification that proves it
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # THE ONLY JOB IN THIS REPOSITORY WITH THESE TWO, and they are here rather than at the
      # workflow level for that reason. `id-token: write` is the OIDC token Sigstore signs with;
      # `attestations: write` is the attestation store. `contents: read` because
      # `gh attestation verify` reads the repository. No long-lived key exists anywhere in this
      # arrangement — §47's "avoid long-lived signing secrets where a safer OIDC mechanism is
      # available", and M's pre-ruled default 5.
      #
      # CORRECTED 2026-09-16: "the only job" has been false since round P7 (2026-09-08) moved the
      # attestation stage into `publish.yml` as well. `attestations: write` is on the two `attest`
      # jobs, this one and `publish.yml`'s; `id-token: write` is on those two and on `publish.yml`'s
      # `publish` job, which mints the PyPI token with it. The reasoning above is unchanged — a
      # permission goes on the job that needs it and nowhere wider — and
      # `tests/test_cdm_security_policy.py` holds the set.
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rc-dist
          path: artefacts

      - name: Download the SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rc-sbom
          path: artefacts/sbom

      - name: The digests survived the hand-off
        # An attestation over bytes that are not the gated bytes attests nothing, and an artefact
        # upload/download round trip is a place bytes can change. `SHA256SUMS` was written beside
        # them in the build job; this re-checks it before anything is signed.
        run: |
          set -euo pipefail
          ls -lR artefacts
          (cd artefacts && sha256sum -c SHA256SUMS)

      - name: Attest the wheel, the sdist and both SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artefacts/dist/*
            artefacts/sbom/synapse_cdm.spdx.json
            artefacts/sbom/synapse_cdm.cdx.json

      - name: Verify each attestation — the proof, not the claim
        # §47's chain ends in an attestation, and an attestation nobody verified is a file. This
        # runs the same command a consumer runs, in the same run that produced it, so a broken
        # chain fails HERE rather than in somebody else's audit.
        env:
          # `github.token`, NOT `secrets.GITHUB_TOKEN`. They are the same run-scoped token, and the
          # spelling is deliberate: `publish.yml` states, in its header and in
          # `tests/test_cdm_trusted_publishing.py`, that it contains no `secrets.*` reference at
          # all — because `secrets.` is the namespace a pasted PyPI token would appear in, and a
          # rule with one permitted exception is a rule somebody extends during a failed release.
          # This file followed the other spelling until 2026-09-16, and the credential sweep that
          # enforces the rule read only `publish.yml`; it now reads every workflow.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artefact in artefacts/dist/* artefacts/sbom/synapse_cdm.spdx.json artefacts/sbom/synapse_cdm.cdx.json; do
            case "$artefact" in
              */SHA256SUMS) continue ;;
            esac
            echo "::group::verify $artefact"
            gh attestation verify "$artefact" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/rc-build.yml"
            echo "::endgroup::"
          done
