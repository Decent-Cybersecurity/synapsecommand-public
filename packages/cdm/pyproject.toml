# Packaging for the Canonical Data Model — what ships, what does not, and which version this is.
#
# ---------------------------------------------------------------------------------------------
# THE VERSION HERE IS THE PACKAGE'S, NOT THE SCHEMA'S. This file used to read
# `synapse_cdm.version.SCHEMA_VERSION` and defend the choice at length: one semver string, no
# second copy to drift. The defence was against a real failure and the conclusion was wrong.
# `schema_version` is the WIRE CONTRACT's version, governed by MIGRATIONS.md and carried in every
# serialised object; the package version is what `pip install synapse-cdm==…` resolves. They are
# different facts about different things, and MIGRATIONS.md already proves they must be allowed
# to diverge — its "Adapters that landed with no schema change" section holds thirteen entries:
# thirteen releases' worth of shipped behaviour at one unchanged `schema_version`. The full ruling
# is in `synapse_cdm/version.py`, stated once, and nothing restates it here.
#
# Both read statically by setuptools, so nothing in the package is imported at build time.
# ---------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name, spelled the way PyPI normalises it (PEP 503): `pip install synapse-cdm`.
# The IMPORT name stays `synapse_cdm` — Python identifiers cannot hold a hyphen — and the two
# differing is ordinary. Declaring the underscore form here would have worked and would have put
# a name in the metadata that no index page and no `pip install` line ever shows.
name = "synapse-cdm"
dynamic = ["version"]
description = "SynapseCommand Canonical Data Model: the four canonical objects, the adapter SDK, and the validation harness"
readme = "synapse_cdm/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Both files, and NOT because a linter asked. NOTICE is load-bearing: Apache-2.0 section 4(d)
# requires a redistributor of a Work that includes a NOTICE file to carry its attribution notices
# forward, and a wheel IS a redistribution. Before this line the built wheel carried
# `License-Expression: Apache-2.0` and not one byte of licence text — an SPDX identifier and
# nothing to identify. They are copies of the repository-root originals and the copies are
# allowed to exist only because `tests/test_cdm_packaging.py` makes drift a build failure.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Decent Cybersecurity s.r.o." }]
keywords = [
    "canonical-data-model", "adapter", "adapter-sdk", "json-schema", "geospatial",
    "cursor-on-target", "asterix", "stanag-4676", "stanag-4607", "ais", "ads-b",
]
classifiers = [
    # 5 - Production/Stable is the same claim `version.py` rules 1.0.0 on, and it is made in
    # exactly one voice: fourteen adapters shipped and harness-verified, the Adapter contract
    # unchanged across all of them. A 0.x/Beta first release would advertise an instability the
    # tree does not have.
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    # Enumerated rather than left to `Programming Language :: Python :: 3`, because the floor is
    # a real declaration here — `tests/test_cdm_version_floor.py` asserts the package PARSES at
    # 3.11 — and the ceiling is what is actually exercised. Since 2026-09-16 the suite runs on
    # all four in `ci.yml`'s `suite` matrix, so each classifier is an executed reading rather
    # than a declaration; the version-floor module still gates grammar at 3.11 on every
    # interpreter, and 3.12 is the release interpreter `publish.yml` pins.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    # Pure Python, no compiled extension, no platform call anywhere in the package.
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# pydantic carries the models; jsonschema is what the harness validates the PUBLISHED schema
# with (see harness check 2 — validating against the model would test the model against
# itself). Neither is optional: importing synapse_cdm needs the first, running the harness
# the second.
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.0",
]

# `rdflib` is the RDF parser the ontology's own tests read `ontology/*.ttl` with, and it is a
# TEST dependency and nothing else. ADR 0002 decision 6 and ADR 0010 decision 5 fix all four
# conditions and this extra
# is where the first of them lands: test/development only, licence confirmed compatible before it
# landed, no RDF runtime dependency, the choice recorded in ADR 0002/0010 lineage. rdflib 7.6.0 is
# BSD-3-Clause and its one non-optional dependency, pyparsing, is MIT — both permissive and both
# compatible with Apache-2.0, which is the criterion `docs/adr/0010-...md` decision 5 states for a
# test extra. Nothing under `synapse_cdm/` imports it: `tests/test_cdm_boundary.py` is the check,
# and `spec/sc-oes/README.md` ("Machine authorities") is the reason — the runtime reads the GENERATED `registry/sc_oes/ontology_terms.json`
# and never parses Turtle.
[project.optional-dependencies]
test = ["pytest>=8.0", "rdflib>=7.0"]
# The lint stage's ONE pin, added 2026-09-16. `ci.yml`'s `lint` job and `publish.yml`'s gate both
# install this extra rather than typing a version of their own, so the tool version and the rule
# set below are read from one file by both workflows and by a contributor following
# CONTRIBUTING.md; a workflow line `ruff==` is what `tests/test_cdm_lint_stage.py` refuses. Pinned
# exactly, not floored, because the rule set below was measured against this version and a newer
# ruff can add a rule to `E9` or change what F821 sees.
lint = ["ruff==0.16.7"]

[project.urls]
Homepage = "https://github.com/Decent-Cybersecurity/synapsecommand-public"
# The rendered site, not a file in the repository. The previous value pointed at the raw
# `synapse_cdm/README.md` on GitHub — which is the file PyPI is ALREADY rendering as this
# project's long description, so "Documentation" led back to the page the reader was on.
Documentation = "https://docs.synapsecommand.com/"
Source = "https://github.com/Decent-Cybersecurity/synapsecommand-public"
Issues = "https://github.com/Decent-Cybersecurity/synapsecommand-public/issues"
Changelog = "https://github.com/Decent-Cybersecurity/synapsecommand-public/blob/main/packages/cdm/synapse_cdm/MIGRATIONS.md"

[project.scripts]
# The entry points the README documents as `python -m ...`; every one of them stays importable
# that way. `cdm-conformance` joined 2026-09-06 with the SC-OES conformance tool:
# `spec/sc-oes/13-conformance.md` ("Exit codes") requires a
# process status a CI system can branch on, and a console script is how this repository has
# always spelled "runnable without knowing where the package is installed".
cdm-harness = "synapse_cdm.harness:main"
cdm-schemas = "synapse_cdm.schemas:main"
cdm-conformance = "synapse_cdm.conformance:main"
# `synapse` joined 2026-09-07 with the Synapse Conformance Suite (F2.4). It is the one entry
# point NOT spelled `cdm-*`, because SOIF §19 spells the command it must answer to —
# `synapse conformance run --adapter cat021` — and a console script whose name a specification
# fixes is not a naming choice this repository gets to make. The three above are unchanged; a
# collision on a caller's PATH is documented rather than defended against, because renaming it
# would leave the specification's own command line unrunnable.
synapse = "synapse_cdm.suite:main"

# ---------------------------------------------------------------------------------------------
# LINT, AND WHY THE RULE SET IS THIS SMALL. Added 2026-09-08 by SOIF Part 1 round P7, for §50's
# `lint/type` stage in `.github/workflows/publish.yml`.
#
# F7.1's pre-ruled default was `select = ["E9", "F"]` — syntax errors plus pyflakes, the
# "zero-noise floor". The reading that decided the set was taken at that round's Act 0 with ruff
# 0.16.6, and it refuted the "zero-noise" half:
#
#     ruff check packages/cdm --select E9   ->  All checks passed
#     ruff check .            --select E9   ->  All checks passed
#     ruff check packages/cdm --select F    ->  12 (8 F401, 2 F541, 2 F841)
#     ruff check .            --select F    ->  47 (26 F401, 13 F841, 8 F541)
#
# The default's own escape clause governs: "If `ruff check` finds anything in the existing tree, it
# is a FINDING listed in the report, and the rule set narrows to what passes with the narrowing
# documented — the tree is not 'cleaned up' in a release-engineering round." So the set is `E9`.
#
# THAT IS A NARROWING AND NOT A DISMISSAL. `E9` is the class that is never a style opinion: a
# syntax error, or a name that is not defined at all. `F`'s 47 are real and are recorded as a known
# limitation for P8's §57 item 15 — unused imports and unused locals, none of which changes what
# the package does, and every one of which needs an edit to a shipped module that a release round
# has no business making. A stage added red is a stage somebody switches off in the release it
# first blocks; this one is added green and can only go red on something new.
#
# CORRECTED 2026-09-16: THE SENTENCE ABOVE DESCRIBED A SET THIS FILE DID NOT SELECT. Under ruff
# 0.16.6, `select = ["E9"]` enables exactly one rule — `io-error` (E902), read off
# `ruff check --show-settings` — a syntax error is reported regardless of selection, and "a name
# that is not defined at all" is pyflakes' F821, which `E9` never included. So the stage as
# configured caught syntax errors and unreadable files and never an undefined name, on a tag or
# anywhere else. The set is now `E9,F821`, which is what the sentence meant: measured at 0
# findings over `packages/cdm gates tests` on 2026-09-16, so it is added green, under the same
# escape clause as the original narrowing. The rest of `F` (27 F401 on the same reading, all
# `--fix`able) is still the documented limitation and still a ruling of its own. The version is
# pinned once, in the `[lint]` extra above, and `ci.yml` now runs this set on every push.
#
# AND, LATER THE SAME DAY, THE F401s WERE REMOVED. The audit's helpers commit deleted every unused
# import the reading above counted — 29 by then, two test modules having gained one each that
# morning — and `ruff check --select F401` over the three roots reads 0. `select` is NOT widened
# here: `tests/test_cdm_lint_stage.py` makes widening a ruling and an edit to both files, and the
# readiness report's item 3 makes it a round of its own. What remains of `F` is 13 F841 and 8 F541,
# measured with ruff 0.16.6 on 2026-09-16, none of which changes what the package does.
#
# There is no `[tool.mypy]`, and that is also F7.1: the package has never had a type config, and
# adding one in a release-engineering round would put a first type-check run inside the pipeline
# that publishes. P8 §57 records it as a limitation.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F821"]

[tool.setuptools.dynamic]
version = { attr = "synapse_cdm.version.PACKAGE_VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["synapse_cdm*"]

# ---------------------------------------------------------------------------------------------
# WHAT SHIPS, BY FILE CLASS. Every class below is a ruling, and the closure is a gate rather than
# this comment: `tests/test_cdm_packaging.py` walks the tree, applies these globs, and fails on
# any file that is neither shipped nor in a stated do-not-ship class.
#
# SHIPS
#   *.py under synapse_cdm/            the models, the adapter SDK, the harness, fourteen adapters.
#   synapse_cdm/*.md                   README, MIGRATIONS, FORMAT_COVERAGE. The protocol docs a
#                                      partner writing an adapter reads; MIGRATIONS is also what
#                                      tells them what `schema_version` will and will not do.
#   fixtures/*/<payloads>              every fixture, in every form it exists in — the raw wire
#                                      bytes AND the parsed twin AND the golden output. A partner
#                                      proves conformance with these; a wheel carrying half the
#                                      evidence measures an adapter against half its evidence.
#   fixtures/*/README.md               an armoured AIS payload and a 28-character hex frame are
#                                      not readable. The file explaining what each fixture is
#                                      there to catch IS part of the fixture.
#   fixtures/*/spec/build_fixtures.py  the generators. An ASTERIX block cannot carry a comment and
#                                      cannot be rebuilt from its twin (LEN and FSPEC are
#                                      functions of the contents), so the module with the
#                                      arithmetic in it is the reviewable form of that fixture set.
#   fixtures/*/spec/*_pin.json         the pin records. NOTICE points at exactly these files for
#                                      "each document's terms as its own front matter states
#                                      them" — so a wheel that ships NOTICE and drops them ships a
#                                      pointer to nothing. They are also the citation of WHICH
#                                      edition of ASTERIX or STANAG each adapter implements, which
#                                      is provenance a partner needs and cannot derive.
#   LICENSE, NOTICE                    into `.dist-info/licenses/`, per `license-files` above.
#
# DOES NOT SHIP
#   fixtures/*/spec/**.pdf             the pinned specification documents. Third-party works under
#                                      EUROCONTROL's, NATO's and MISB's own terms — NOTICE says
#                                      outright they "are not part of the Work and are not covered
#                                      by this licence". None of their bytes is in this repository
#                                      or its history (they are gitignored), so an sdist built
#                                      from a clean clone could not carry them anyway — which is
#                                      exactly why the exclusion has to be POSITIVE. It was
#                                      previously an accident: the old include list enumerated
#                                      extensions and `.pdf` simply was not one of them, so a
#                                      build on a maintainer's machine was one glob away from
#                                      redistributing a NATO standard under Apache-2.0.
#   tests/, docs/, pytest.ini,         repository infrastructure. It judges and renders this
#   wrangler.toml, CONTRIBUTING.md,    package; it is not part of what a consumer installs, and
#   PUBLICATION.md, DCO, gates/        none of it is under `packages/cdm/` to begin with.
#
# THE INCLUDE RULE IS A RECURSIVE GLOB, DELIBERATELY, AND THAT IS THE DEFECT REPAIR
# ---------------------------------------------------------------------------------
# It used to be a hand-written list of extensions — `*.json`, `*.xml`, `*.nmea`, `*.adsb`,
# `*.cat021`, `*.gmti`, `*.md`, `*.py` — with a paragraph beside each new one explaining why the
# raw bytes matter as much as the parsed twin. Every argument in those paragraphs was right and
# the list still went stale twice, silently, in the way an enumeration does: CAT048 shipped and
# nobody added `*.cat048`, CAT034 shipped and nobody added `*.cat034`. The built wheel was missing
# **72 of the 692 files** the package tracks — every raw ASTERIX data block for two of the ten
# adapters — while the comment above the list explained at length why exactly those files must
# never be dropped. The harness still ran against it and still reported green, because the parsed
# twins were there; it was measuring two adapters against half their evidence.
#
# So the enumeration is gone, the same way `tests/test_cdm_pins.py` deleted its list of pins. One
# recursive glob ships every fixture whatever it is called, and the two things that must NOT be
# shipped are named positively below.
#   registry/**/*                      the machine-readable runtime artefacts of ADR 0004 —
#                                      `registry/sc_oes/ontology_terms.json` today, the governed
#                                      event registry beside it later. `spec/sc-oes/03-event-types.md`
#                                      ("The registry, and where it lives") requires them to ship
#                                      in the wheel, load with `importlib.resources`, need no
#                                      checkout and no network, and be read as DATA. A recursive
#                                      glob for the same reason the fixtures one is recursive: the
#                                      second artefact must not depend on somebody remembering.
#
# THE TWO LARGE DOCUMENTS SHIP WHOLE, AND THEIR SIZE IS RECORDED HERE RATHER THAN BOUNDED. Noted
# 2026-09-16 by the repo-hygiene audit, which found the fact stated nowhere in the tree. The
# `*.md` glob below carries `FORMAT_COVERAGE.md` — 1,887,457 bytes and 16,125 lines on that date,
# the largest tracked file in this repository and nearly twice the next — and `MIGRATIONS.md`
# (978,711 bytes, 12,037 lines) into every consumer's site-packages, and both grow on every round
# that closes a park or records an arc: 93 historical blobs of the first (117 MB) and 140 of the
# second (59 MB) delta-compress to a 10.37 MiB pack on the same date. They ship ON PURPOSE and the
# shipping is load-bearing, not incidental: `tests/test_cdm_klv_framing.py` reads both from the
# INSTALLED package through `synapse_cdm.__file__` — `gates/wheel_install.py` says why that module
# is package-only — and the same gate refuses a wheel whose `.py`/`.md` count is not
# `git ls-files synapse_cdm`'s, so a wheel that dropped either would not pass. The size is the
# cost of the SHIPS row above (the protocol documents a partner reads travel with the code they
# describe), and no ceiling is set on it: a ceiling would be one more figure typed in this file,
# and a document that has grown too large to ship whole is a document to split, not to cap. The
# figures are a reading and not a derivation — nothing re-derives them, and a later reader who
# finds them stale has found the growth this note says to expect, not a defect.
[tool.setuptools.package-data]
synapse_cdm = [
    "fixtures/**/*",
    "registry/**/*",
    "*.md",
]

[tool.setuptools.exclude-package-data]
# Both depths spelled out rather than one `**`: `spec/` holds the current edition and
# `spec/history/` holds every superseded one, and setuptools matches these against the relative
# path with `glob(recursive=True)`. The gate asserts the RESULT — no PDF, and nothing under any
# `spec/` that is not a generator or a pin record — so a pattern that stopped matching would fail
# a build rather than quietly widen the wheel.
#
# `*.txt` JOINED 2026-09-04 AND THE GATE IS WHAT FOUND IT, WHICH IS THE POINT OF ASSERTING THE
# RESULT. The text-pins round pinned IETF RFC 2781 as `fixtures/klv/spec/rfc2781.txt` and added a
# global `*.txt` to `.gitignore`, so git never tracks it and every check that reads `git ls-files`
# was satisfied. **The wheel is built from the GLOBS ABOVE and not from the index**, and
# `fixtures/**/*` matched it — so a document this repository takes care never to redistribute
# would have shipped inside the distribution, with nothing in the git-facing half of the tree to
# show it. `tests/test_cdm_packaging.py::test_no_specification_document_is_shippable` failed on
# exactly that, by name, on the first run after the file landed. That test asks what the globs
# SELECT rather than what they say, and this is the case it was written for.
#
# THE ROUND'S OWN SITE LIST DID NOT INCLUDE THIS FILE, and it is recorded because the omission is
# instructive: the round enumerated the gates that RECOGNISE a pin, and this one does not
# recognise anything — it excludes. A widening that follows a list of recognisers leaves every
# excluder untouched, and an excluder keyed on `.pdf` silently stops excluding the moment a pin is
# not a PDF.
synapse_cdm = [
    "fixtures/*/spec/*.pdf",
    "fixtures/*/spec/history/*.pdf",
    "fixtures/*/spec/*.txt",
    "fixtures/*/spec/history/*.txt",
]
