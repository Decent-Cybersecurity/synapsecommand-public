# gitleaks configuration — the CI secret scanner's second layer (SOIF Part 1 §39, round P5).
#
# WHY THIS FILE EXISTS WITH AN EMPTY ALLOWLIST
# ---------------------------------------------
# §39 permits an allowlist that is "narrow and documented", and the brief for round P5 permitted
# one entry per finding the FIRST RUN proves false-positive. The runs below are gitleaks 8.30.1's
# own output on 2026-09-08, TAKEN AT THE COMMIT THAT INTRODUCED THIS FILE — `e37cf20`, round P5's
# — and they produced nothing to allowlist:
#
#     gitleaks git . --redact --config .gitleaks.toml
#         -> 246 commits scanned, no leaks found
#     gitleaks git --config .gitleaks.toml --log-opts "origin/main..HEAD" .
#         ->   7 commits scanned, no leaks found
#
# RE-TAKEN 2026-09-08 IN ROUND P6, at ROUND P6's OWN COMMIT — the EIGHTH of the arc, the one
# carrying this paragraph — both clean and both one higher:
#
#     gitleaks git . --redact --config .gitleaks.toml
#         -> 247 commits scanned, no leaks found
#     gitleaks git --config .gitleaks.toml --log-opts "origin/main..HEAD" .
#         ->   8 commits scanned, no leaks found
#
# **AND THAT RE-TAKING IS THE POINT, not a correction of an error.** P5 anchored these figures to
# "the commit that carries this file" so that a reading taken BEFORE the round's own commit could
# not be committed as though it described the tree it shipped in. That anchor is now spelled as a
# HASH, because the original phrase has a second reading — every later commit also carries this
# file — under which the sentence goes false on the next round's commit without anybody editing
# it. Neither number is a constant: the arc grows by one per round and full history by one per
# commit. A round that quotes either one states the commit it took it at, or states nothing.
#
# P5'S HASH IS WRITTEN ABOVE AND P6'S IS NOT, AND THE ASYMMETRY IS DELIBERATE. `e37cf20` is a
# PAST commit: pushed, immutable, and nameable. P6's own commit is the one carrying this comment,
# and a hash written here would be the hash of the commit BEFORE this comment was added — writing
# it changes the commit and falsifies it, which is the loop P5's header refused to enter. So the
# past reading is anchored by hash and the present one by ordinal, and both are checkable: the
# eighth commit of `origin/main..HEAD` is this one.
#
# The second of those is §42's "no secrets in the campaign history", over the whole SOIF Part 1
# arc, and it is clean.
#
# BOTH NUMBERS ARE THE SCANNER'S, AND NEITHER IS A COMMIT COUNT THIS REPOSITORY WOULD PRINT.
# `git rev-list --count HEAD` is 245 and `git rev-list --count origin/main..HEAD` is 7: gitleaks
# reports one more than `rev-list` for a full-history scan (its own counting convention, stable
# before and after this commit) and the same number for a range. The SEVENTH commit of the arc is
# the one carrying this file. `origin/main..HEAD` grows by exactly one when a round's own commit
# lands, so an arc reading taken before that commit says six and is false the instant it is
# committed — this file states the reading AT the commit for that reason, not the reading before
# it.
#
# A third run, `gitleaks dir .`, reported three findings and NONE of them is in the repository:
# all three are in `rounds/`, the untracked round apparatus (`git ls-files rounds/` -> 0), and all
# three are the same string — an SSH signing key FINGERPRINT of the form `SHA256:...`, which is
# the public half of a signing key written into a round record on purpose. They are not
# allowlisted here, and deliberately not: the CI job scans the GIT HISTORY, those files are not in
# it, and an allowlist entry for a path CI never reads would be an entry nobody could ever see
# fire. If a future round tracks a file carrying a key fingerprint, THAT is when the entry is
# written, with the path and the reason.
#
# EXTENDING THE DEFAULT RULE SET RATHER THAN REPLACING IT
# -------------------------------------------------------
# `useDefault = true` keeps every rule gitleaks ships and adds nothing. A configuration that
# enumerated its own rules would silently stop matching the ones added upstream, which is the
# failure mode a scanner cannot report: it would go on passing.
title = "synapse-cdm"

[extend]
useDefault = true

# NO `[[allowlists]]` BLOCK AT ALL, and that is the empty allowlist rather than an omission.
# gitleaks 8.30.1 REFUSES an allowlist with no check in it — "must contain at least one check for:
# commits, paths, regexes, or stopwords" — so an empty block is not a way to say "nothing is
# allowlisted"; the absence of the block is. The reading that makes it empty is in the header
# above, and `tests/test_cdm_security_policy.py` asserts that this file declares no allowlist
# entry, so an entry cannot be added without the test that reads it also being changed.
