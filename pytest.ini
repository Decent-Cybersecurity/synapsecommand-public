[pytest]
# `pytest` with no arguments, from this directory, is the whole suite.
#
# `pythonpath` puts packages/cdm on sys.path so a fresh clone can run its own tests before
# anything is installed. It is deliberately the local source rather than an installed copy:
# this suite's job is to judge the code in this working tree, and a stale wheel silently
# passing for it is the kind of green run that means nothing.
testpaths = tests
pythonpath = packages/cdm
# Two markers, each registered so `pytest -m <name>` / `-m "not <name>"` select its class as a
# whole. `normative` (adapter expansion phase 1, 2026-09-20): a test so marked asks for an
# authorised normative schema held OUTSIDE the repository through `tests/normative_support.py`.
# `reference` (2026-10-04): a test so marked asks for the pinned open-dis-python checkout, also
# held OUTSIDE the repository, through `tests/dis7_reference_support.py`. Either kind is SKIPPED
# with a reason beginning `BLOCKED_EXTERNAL_EVIDENCE` — never passed — when its hook is unset or
# its resource fails verification; `normative` also when the optional `validate` extra (lxml) is
# not installed.
markers =
    normative: needs a normative schema resource outside the repository and the `validate` extra; records BLOCKED_EXTERNAL_EVIDENCE as a skip when either is missing
    reference: needs the pinned open-dis-python checkout outside the repository (SYNAPSE_CDM_OPENDIS_DIR); records BLOCKED_EXTERNAL_EVIDENCE as a skip when it is missing or not clean at the pin
